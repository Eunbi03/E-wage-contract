      }).getSealImage(formData.companyName);
    }
  }, [contractStatus, formData.companyName]);

  // ⭐ "완료" 화면에서 PDF 저장 버튼을 누르기 전에 직인 조회가 끝났는지 — 이미 직인이 있거나
  //   (관리자가 막 승인한 직후처럼 동기적으로 채워진 경우), 위 조회가 끝나서(성공/실패 무관)
  //   sealCheckedFor에 이 회사명이 찍혔으면 true다. false인 동안 PDF 저장 버튼을 숨겨서,
  //   아직 안 끝난 사이에 window.print()가 직인 없이 찍히는 일을 막는다.
  const sealReady = !!sealImages[formData.companyName] || sealCheckedFor === formData.companyName;

  // 4-4. 주요 헬퍼 함수 (Index.html)
  // ⭐ 입력값 변경 처리 - 관리자 우측 화면
  const handleChange = (e) => {
    const { name, value, type, checked } = e.target;
    const newVal = type === 'checkbox' ? checked : value;

    if (name === 'companySelect') {
      companyTouchedRef.current = true;
      const selected = companies.find(c => c.name === value);
      setFormData({ ...formData, companyName: selected.name, companyAddress: selected.address, companyPhone: selected.phone, repName: selected.rep, managerPhone: selected.managerPhone, managerEmail: selected.managerEmail, managerName: selected.managerName });
    } else if (name === 'contractStart') {
      // ⭐ 시작일을 바꾸면 종료일은 1년(시작일+12개월-1일)으로 자동 맞춘다 — 그 뒤 종료일만 따로 고칠 수 있다.
      setFormData({ ...formData, contractStart: newVal, contractEnd: calcEnd(newVal, 12) });
    } else if (name === 'empRegNumber') {
      setFormData({ ...formData, [name]: autoHyphenRegNum(newVal) });
    } else if (name === 'empPhone') {
      setFormData({ ...formData, [name]: autoHyphenPhone(newVal) });
    } else {
      if (name === 'workPlace') defaultsTouchedRef.current = true;
      setFormData({ ...formData, [name]: newVal });
    }
  };

  // ⭐ 근로자 카드 하나 수정. patch는 객체 또는 (이전 카드 => 객체) 함수.
  const updateWorker = (key, patch) => setWorkerList(prev => prev.map(w => w.key === key ? { ...w, ...(typeof patch === 'function' ? patch(w) : patch) } : w));

  // ⭐ 근로유형 + 월지급액으로 임금테이블 시트 조회(카드별). 금액을 바꾸는 즉시 이전 계산값을 비우고,
  //   입력이 잠깐 멈추면(300ms) 서버에 물어본다. 응답은 그 카드의 가장 최근 요청 것만 반영한다.
  const requestWageLookup = (key, wageType, monthlyDigits) => {
    const seq = (wageReqSeqRef.current[key] || 0) + 1;
    wageReqSeqRef.current[key] = seq;
    clearTimeout(wageLookupTimerRef.current[key]);
    const ready = !!monthlyDigits && monthlyDigits.length >= 6;
    updateWorker(key, { wage: { ...EMPTY_WAGE, monthlyTotal: monthlyDigits ? Number(monthlyDigits) : 0 }, wageLookup: ready ? 'loading' : 'idle' });
    if (!ready) return;
    wageLookupTimerRef.current[key] = setTimeout(() => {
      google.script.run.withSuccessHandler(res => {
        if (seq !== wageReqSeqRef.current[key]) return;
        if (res) updateWorker(key, { wage: res, wageLookup: 'ok' });
        else updateWorker(key, { wageLookup: 'notfound' });
      }).withFailureHandler(err => {
        if (seq !== wageReqSeqRef.current[key]) return;
        console.error('임금테이블 조회 실패:', err);
        updateWorker(key, { wageLookup: 'error' });
      }).getWageDataFromSheet(wageType, monthlyDigits);
    }, 300);
  };

  const handleWorkerMonthlyChange = (w, digits) => {
    if (w.manualWage) {
      // ⭐ 직접 입력 모드: 조회하지 않고, 연봉은 월지급액×12로 같이 채운다(이후 직접 수정 가능).
      const monthly = Number(digits) || 0;
      updateWorker(w.key, prev => ({ wage: { ...prev.wage, monthlyTotal: monthly, annualTotal: monthly * 12 } }));
    } else {
      requestWageLookup(w.key, w.wageType, digits);
    }
  };

  const handleWorkerWageTypeChange = (w, wageType) => {
    updateWorker(w.key, { wageType, wageTypeTouched: true });
    if (!w.manualWage) requestWageLookup(w.key, wageType, w.wage.monthlyTotal ? String(w.wage.monthlyTotal) : '');
  };

  const handleWorkerToggleManual = (w, on) => {
    if (on) {
      // ⭐ 켜면 진행 중인 조회는 무시하고, 지금 보이는 값(조회된 값이 있으면 그 값)에서 이어서 고친다.
      wageReqSeqRef.current[w.key] = (wageReqSeqRef.current[w.key] || 0) + 1;
      clearTimeout(wageLookupTimerRef.current[w.key]);
      const monthly = Number(w.wage.monthlyTotal) || 0;
      updateWorker(w.key, { manualWage: true, wage: { ...w.wage, annualTotal: Number(w.wage.annualTotal) || monthly * 12 } });
    } else {
      updateWorker(w.key, { manualWage: false });
      requestWageLookup(w.key, w.wageType, w.wage.monthlyTotal ? String(w.wage.monthlyTotal) : '');
    }
  };

  const minimumWage = Number(defaults && defaults.minimumWage) || 10320;

  // 4-4. 주요 헬퍼 함수 (Index.html)
  // ⭐ (관리자)근로자 발송 정보 입력 여부 & 발송 완료
  const handleSend = () => {
    if (!formData.contractStart || !formData.contractEnd) return alert("임금계약기간을 입력해 주세요.");
    if (formData.contractEnd < formData.contractStart) return alert("임금계약기간의 종료일이 시작일보다 빠릅니다.");
    for (let i = 0; i < workerList.length; i++) {
      const w = workerList[i];
      if (!w.name.trim()) {
        return alert(`${i + 1}번째 근로자의 성명을 입력해 주세요.`);
      }
      if (!w.password.trim()) {
        return alert(`${i + 1}번째 근로자의 전화번호를 입력해 주세요.`);
      }
      if (w.mode === 'email' && !w.email.trim()) {
        return alert(`${i + 1}번째 근로자의 이메일을 입력해 주세요.`);
      }
      if (!/^\d{4}$/.test(String(w.joinYear || ''))) {
        return alert(`${i + 1}번째 근로자의 입사년도를 4자리 숫자로 입력해 주세요.`);
      }
      if (!w.wage.monthlyTotal) {
        return alert(`${i + 1}번째 근로자의 월지급액을 입력해 주세요.`);
      }
      if (!isWorkerWageReady(w)) {
        return alert(w.manualWage
          ? `${i + 1}번째 근로자: ${manualWageError(w.wage)}`
          : `${i + 1}번째 근로자의 금액이 "${w.wageType}" 임금테이블에서 확인되지 않았습니다. 금액을 다시 확인하거나 "직접 입력"을 사용해 주세요.`);
      }
    }

    // ⭐ 최저시급 미달은 막지 않고 한 번 더 확인만 받는다(설정 탭의 최저시급 기준).
    const belowMin = workerList.filter(w => isBelowMinimumWage(w, minimumWage));
    if (belowMin.length && !confirm(`⚠ 다음 근로자의 시급이 최저시급(${fmtWon(minimumWage)}원)보다 낮습니다.\n${belowMin.map(w => `- ${w.name}: ${fmtWon(w.wage.hourlyWage)}원`).join('\n')}\n\n그래도 발송하시겠습니까?`)) return;

    if(!confirm("발송하시겠습니까?")) return;
    const payload = workerList.map(w => ({
      name: w.name, password: w.password, email: w.email, mode: w.mode,
      joinYear: w.joinYear, wageType: w.wageType, monthlyTotal: w.wage.monthlyTotal,
      manualWage: w.manualWage, wage: w.wage
    }));
    setLoading(true);
    google.script.run.withSuccessHandler(res => {
      setLoading(false);
      // ⭐ 대량 발송 시 일부는 즉시, 나머지는 몇 분 간격으로 자동으로 이어서 발송된다(processSendQueue).
      //   실패(failNow)가 있으면 queuedRemaining이 0이어도 "발송 완료"로 뜨면 안 되므로 반드시 먼저 체크한다.
      if (res && res.failNow > 0) {
        alert(`⚠ 발송 실패 있음: 총 ${res.totalCount}명 중 ${res.failNow}명 발송 실패.${res.sentNow ? ` (${res.sentNow}명 성공)` : ''}${res.queuedRemaining ? `\n나머지 ${res.queuedRemaining}명은 잠시 후 순차 발송됩니다.` : ''}\n'발송큐' 시트에서 FAILED 항목의 사유를 확인해 주세요.`);
      } else if (res && res.queuedRemaining > 0) {
        alert(`발송 시작됨: 총 ${res.totalCount}명 중 ${res.sentNow}명 즉시 발송 완료.\n나머지 ${res.queuedRemaining}명은 잠시 후부터 순차적으로 자동 발송됩니다.`);
      } else {
        alert(`발송 완료! (총 ${res ? res.totalCount : workerList.length}명)`);
      }
    }).withFailureHandler(handleServerError).sendBatchContracts(formData, payload);
  };

  // 4-4. 주요 헬퍼 함수 (Index.html)
  // ⭐ (근로자)본인인증 확인
  const checkPw = () => {
    if (!verificationInput.trim()) return alert("비밀번호(전화번호)를 입력해 주세요.");
    setLoading(true);
    google.script.run.withSuccessHandler(ok => {
      setLoading(false);
      if (ok) setIsIdentityVerified(true);
      else alert("비밀번호 불일치");
    }).withFailureHandler(handleServerError).verifyIdentity(urlId, verificationInput);
  };

  // 4-4. 주요 헬퍼 함수 (Index.html)
  // ⭐ (근로자)정보 입력 확인
  const submitWorkerInfo = () => {
    if(!formData.empName || !formData.empRegNumber || !formData.empAddress || !formData.empPhone) return alert("모든 정보를 입력해주세요.");
    setIsWorkerInfoSubmitted(true);
  };
  
  // 4-4. 주요 헬퍼 함수 (Index.html)
  // ⭐ 서명 시작점 확인
  const startDraw = (e) => { 
    const ctx = canvasRef.current.getContext('2d'); 
    ctx.lineWidth = 5;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.strokeStyle = 'black';
    
    const rect = canvasRef.current.getBoundingClientRect(); 
    const x = (e.clientX||e.touches[0].clientX) - rect.left; 
    const y = (e.clientY||e.touches[0].clientY) - rect.top; 
    ctx.beginPath(); ctx.moveTo(x,y); setIsDrawing(true); 
  };

  // 4-4. 주요 헬퍼 함수 (Index.html)
  // ⭐ 서명 그리기
  const moveDraw = (e) => { 
    if(!isDrawing) return; 
    const ctx = canvasRef.current.getContext('2d'); 
    const rect = canvasRef.current.getBoundingClientRect(); 
    const x = (e.clientX||e.touches[0].clientX) - rect.left; 
    const y = (e.clientY||e.touches[0].clientY) - rect.top; 
    ctx.lineTo(x,y); 
    ctx.stroke(); 
  };
  
  // 4-4. 주요 헬퍼 함수 (Index.html)
  // ⭐ 서명 지우기
  const clearCanvas = () => {
    const canvas = canvasRef.current;
    if(canvas) {
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    }
    const signKey = signKeyForStep(workerStep);
    setSignatures(prev => ({ ...prev, [signKey]: null }));
  };

  // 4-4. 주요 헬퍼 함수 (Index.html)
  // ⭐ 서명 크기 조정
  const getCompressedSignature = () => {
    const canvas = canvasRef.current;
    const mini = document.createElement('canvas');
    mini.width = canvas.width / 2;
    mini.height = canvas.height / 2;
    const ctx = mini.getContext('2d');
    ctx.drawImage(canvas, 0, 0, mini.width, mini.height);
    return mini.toDataURL('image/png');
  };
  
  // 4-4. 주요 헬퍼 함수 (Index.html)
  // ⭐ (근로자)서명 확인
  const saveSignatureAndNext = (signKey) => {
    const canvas = canvasRef.current;
    const blank = document.createElement('canvas'); blank.width = canvas.width; blank.height = canvas.height;
    if(canvas.toDataURL() === blank.toDataURL()) return alert("서명을 해주세요.");
    const currentSignData = getCompressedSignature(); 
    setSignatures(prev => ({ ...prev, [signKey]: currentSignData }));
    setWorkerStep(workerStep + 1);
  };

  // 4-4. 주요 헬퍼 함수 (Index.html)
  // ⭐ (근로자)서명 확인
  const finalSubmit = () => {
    const canvas = canvasRef.current;
    const blank = document.createElement('canvas'); blank.width = canvas.width; blank.height = canvas.height;
    if(canvas.toDataURL() === blank.toDataURL()) return alert("서명을 해주세요.");
    const finalSign = getCompressedSignature();
    const finalSignatures = { ...signatures, sign3: finalSign };
    
    if(!confirm("서명을 제출하시겠습니까? 담당자 승인 후 계약이 최종 완료됩니다.")) return;
    setLoading(true);
    google.script.run.withSuccessHandler(() => {
      setLoading(false); 
      setSignatures(finalSignatures); 
      setContractStatus('SIGNED_BY_WORKER');
      setStep(3); 
    }).withFailureHandler(handleServerError).saveContractData({ ...formData, ...finalSignatures, contractId: urlId });
  };

  // 4-4. 주요 헬퍼 함수 (Index.html)
  // ⭐ (관리자)최종 승인 확인
  const managerApprove = () => {
    if(!confirm("이대로 계약을 최종 승인하고 직인을 날인하시겠습니까?\n근로자에게 완료 안내(이메일/문자)가 자동 발송됩니다.")) return;
    setLoading(true);
    google.script.run.withSuccessHandler(approveResult => {
      if (approveResult === 'WRONG_PASSWORD') {
        setLoading(false);
        return alert("관리자 비밀번호가 확인되지 않아 승인하지 못했습니다. 승인 링크를 다시 열어 비밀번호를 입력해 주세요.");
      }
      // ⭐ 이 법인의 직인 이미지를 먼저 받아온 뒤에 COMPLETED로 전환한다. 순서를 반대로 하면
      //   자동 아카이빙(#print-area 캡처)이 직인 이미지가 도착하기 전 화면을 스냅샷으로
      //   떠버릴 수 있다.
      google.script.run.withSuccessHandler(sealResult => {
        setLoading(false);
        justApprovedRef.current = true;
        if (sealResult && sealResult.dataUrl) {
          setSealImages(prev => ({ ...prev, [formData.companyName]: sealResult.dataUrl }));
          setContractStatus('COMPLETED');
          alert("최종 승인 및 발송이 완료되었습니다.");
        } else {
          // ⭐ 예전엔 직인을 못 찾아도 조용히 넘어가서 "직인이 안 찍혔는데 왜인지 모르겠다"는
          //   상태가 됐다. 승인/보관 자체는 그대로 진행하되(이미 approveContract 성공), 왜
          //   직인 없이 저장되는지 이유를 바로 알려준다.
          setContractStatus('COMPLETED');
          console.warn('직인 이미지 없음/실패:', sealResult && sealResult.message);
          alert("최종 승인 및 발송은 완료되었지만, 직인 없이 저장됩니다.\n\n사유: " + (sealResult ? sealResult.message : '알 수 없는 오류') + "\n\nApps Script 프로젝트의 Seals.html 파일에 회사설정 시트의 법인명과 정확히 같은 이름으로 직인 이미지(base64)가 등록되어 있는지 확인해 주세요.");
        }
      }).withFailureHandler(sealErr => {
        // ⭐ 이 시점엔 approveContract가 이미 성공해서 계약은 COMPLETED로 커밋된 뒤다.
        //   직인 이미지 조회 자체(네트워크/권한 등)가 실패한 것이므로 승인 자체를 실패로
        //   보이게 하지 않고, 직인 없이 완료 화면으로 계속 진행하되 이유는 알려준다.
        console.error('직인 이미지 로드 실패, 직인 없이 계속 진행:', sealErr);
        setLoading(false);
        justApprovedRef.current = true;
        setContractStatus('COMPLETED');
        alert("최종 승인은 완료되었습니다. 다만 직인 이미지 조회 중 오류가 발생해 직인 없이 저장됩니다.\n\n오류: " + sealErr);
      }).getSealImage(formData.companyName);
    }).withFailureHandler(handleServerError).approveContract(urlId, adminPasswordRef.current);
  };

  // ⭐ 승인 직후(직인이 찍힌 최종본이 렌더링된 시점) 화면에 보이는 계약서 그대로를 서버로 보내
  // Drive에 자동 백업한다. 이미 완료된 계약서를 나중에 다시 열람할 때는(재승인이 아니므로) 반복 저장하지 않는다.
  useEffect(() => {
    if (contractStatus === 'COMPLETED' && justApprovedRef.current) {
      justApprovedRef.current = false;
      const el = document.getElementById('print-area');
      if (el && urlId) {
        // 화면 표시 전환용 클래스(hidden)만 제거한 사본을 만들고, 현재 적용 중인 스타일(Tailwind CDN이
        // 생성한 것 포함)을 그대로 함께 담아 보내 표/테두리 등 서식이 보관본에도 그대로 남게 한다.
        const clone = el.cloneNode(true);
        clone.classList.remove('hidden');
        const styles = Array.from(document.querySelectorAll('style')).map(s => s.outerHTML).join('');
        google.script.run
          .withFailureHandler(err => console.error('계약서 자동 저장 실패:', err))
          .archiveContractHtml(urlId, styles + clone.outerHTML);
      }
    }
  }, [contractStatus]);

  // ⭐ 발송 최대 인원
  const addWorker = () => {
    if (workerList.length >= 10) return alert("최대 10명");
    const w = newWorker((defaults && defaults.wageType) || workerList[0].wageType);
    setWorkerList([...workerList, w]);
    setPreviewKey(w.key);
  };
  const removeWorker = (key) => {
    if (workerList.length === 1) return;
    setWorkerList(workerList.filter(w => w.key !== key));
  };

  // ⭐ 작성 탭 미리보기 — 공통 정보(formData)에 고른 카드의 근로자·임금 정보를 합쳐서 보여준다.
  //   근로자 화면/승인/완료 화면(step 2·3)은 서버에서 받은 계약 데이터(formData)를 그대로 쓴다.
  const previewWorker = workerList.find(w => w.key === previewKey) || workerList[0];
  const previewData = step === 1 ? {
    ...formData, empName: previewWorker.name, empPhone: previewWorker.password,
    joinYear: previewWorker.joinYear, wageType: previewWorker.wageType, ...previewWorker.wage
  } : formData;


  if (loading) return <div className="h-screen flex items-center justify-center font-bold text-xl">처리중...</div>;

  // ⭐ (근로자)접속 링크 유효성 확인
  if (isInvalidLink) {
    return (
      <div className="min-h-screen bg-gray-200 flex items-center justify-center p-4 font-sans">
        <div className="bg-white p-10 rounded-xl shadow-2xl max-w-md w-full text-center border border-gray-300">
          <div className="mb-6 flex justify-center">
            <div className="bg-red-100 p-4 rounded-full">
              <svg xmlns="http://www.w3.org/2000/svg" className="h-12 w-12 text-red-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
              </svg>
            </div>
          </div>
          <h2 className="text-2xl font-bold text-gray-800 mb-4">접속 불가</h2>
          <p className="text-gray-600 leading-relaxed break-keep">
            유효하지 않거나 이미 만료된 계약서 링크입니다.<br/>
            문서가 삭제되었거나 기한이 지났을 수 있습니다.<br/>
            <strong className="text-gray-800 mt-2 inline-block">담당자에게 다시 문의해 주세요.</strong>
          </p>
        </div>
      </div>
    );
  }
  
  // ⭐ 근로자 화면
  return (
    <div className="bg-gray-200 min-h-screen font-sans flex flex-col items-center">
      
      {/* ⭐ (근로자)본인인증 */}
      {step === 2 && !isIdentityVerified && !isManagerView && (
        <div className="fixed inset-0 z-50 bg-gray-100 flex items-center justify-center p-4">
          <div className="bg-white p-10 rounded-3xl shadow-2xl max-w-md w-full text-center border-2 border-blue-50">
            <Lock className="w-12 h-12 mx-auto mb-4 text-blue-600 inline-block" />
            <h2 className="text-2xl font-bold mb-2">본인인증</h2>
            <p className="text-gray-500 mb-8 text-sm">비밀번호(전화번호)를 입력하세요.</p>
            <input type="password" value={verificationInput} onChange={e=>setVerificationInput(e.target.value)} className="w-full p-5 border-2 rounded-2xl text-2xl text-center tracking-widest mb-6 focus:border-blue-500 outline-none" placeholder="전화번호" />
            <button onClick={checkPw} className="w-full py-5 bg-blue-600 text-white rounded-2xl text-xl font-bold shadow-lg hover:bg-blue-700">인증하기</button>
          </div>
        </div>
      )}

      {/* ⭐ (근로자)정보 입력 */}
      {step === 2 && isIdentityVerified && !isWorkerInfoSubmitted && !isManagerView && (
        <div className="fixed inset-0 z-50 bg-white flex flex-col items-center justify-center p-6 overflow-y-auto">
          <div className="w-full max-w-lg">
            <div className="text-center mb-8">
              <h2 className="text-3xl font-bold text-gray-900 mb-2">근로자 정보 확인</h2>
              <p className="text-gray-500">정확한 계약 작성을 위해 정보를 확인해주세요.</p>
            </div>
            <div className="space-y-6">
              <div><label className="block text-sm font-bold text-gray-700 mb-1">성 명</label><input type="text" name="empName" value={formData.empName} onChange={handleChange} className="w-full p-4 border rounded-lg text-lg bg-gray-50"/></div>
              <div><label className="block text-sm font-bold text-gray-700 mb-1">연락처</label><input type="text" name="empPhone" value={formData.empPhone} onChange={handleChange} className="w-full p-4 border rounded-lg text-lg bg-gray-50"/></div>
              <div><label className="block text-sm font-bold text-blue-700 mb-1">주민등록번호 (필수)</label><input type="text" name="empRegNumber" placeholder="예: 900101-1234567" value={formData.empRegNumber} onChange={handleChange} className="w-full p-4 border rounded-lg text-lg"/></div>
              <div><label className="block text-sm font-bold text-blue-700 mb-1">현재 거주 주소 (필수)</label><input type="text" name="empAddress" placeholder="도로명 주소 입력" value={formData.empAddress} onChange={handleChange} className="w-full p-4 border rounded-lg text-lg"/></div>
            </div>
            <button onClick={submitWorkerInfo} className="w-full py-5 bg-blue-600 text-white rounded-xl font-bold text-xl mt-10 shadow-lg hover:bg-blue-700 transition">정보 입력 완료</button>
          </div>
        </div>
      )}

      {/* ⭐ 근로자 정보 입력 */}
      {step === 2 && isIdentityVerified && isWorkerInfoSubmitted && !isManagerView && (
        <div className="fixed inset-0 z-50 bg-white flex flex-col p-0">
          <div className="bg-white border-b p-4 flex justify-between items-center sticky top-0 z-10 shadow-sm">
            <span className="text-sm font-bold text-gray-500">Step {workerStep} / {LAST_WORKER_STEP}</span>
            <h2 className="text-lg font-bold truncate px-2">{workerStep < FIRST_SIGN_STEP ? '임금계약서 확인' : '동의 및 서명'}</h2>
            <div className="w-10"></div>
          </div>
          
          <div className="flex-1 overflow-y-auto p-6 text-lg leading-relaxed text-gray-800 pb-32 break-keep">
            {/* ⭐ [단계1]사용자 및 근로자 정보*/}
            {workerStep === 1 && (
              <div className="space-y-6">
                <h3 className="text-2xl font-bold border-b-2 border-black pb-2 mb-4 text-center">임 금 계 약 서</h3>
                <div className="text-right text-sm mb-4 font-bold">근무지 : {formData.workPlace}</div>
                <PartyInfoTable formData={formData} />
                <ClauseBody clauseKey="preamble" formData={formData} clauses={clauses} className="text-base" />
              </div>
            )}

            {/* ⭐ [단계2]임금계약기간 · 임금총액 · 퇴직금 */}
            {workerStep === 2 && (
              <div className="space-y-6">
                <div>
                  <h3 className="font-bold text-base mb-1">임금계약기간</h3>
                  <p className="pl-4 text-base font-bold text-blue-700">{formatDate(formData.contractStart)} ~ {formatDate(formData.contractEnd)}</p>
                </div>
                <div>
                  <h3 className="font-bold text-base mb-1">{clauseOf('total', formData, clauses).title}</h3>
                  <ClauseBody clauseKey="total" formData={formData} clauses={clauses} className="pl-4 text-base" />
                </div>
                <div>
                  <h3 className="font-bold text-base mb-1">{clauseOf('retirement', formData, clauses).title}</h3>
                  <ClauseBody clauseKey="retirement" formData={formData} clauses={clauses} className="pl-4 text-base" />
                </div>
              </div>
            )}

            {/* ⭐ [단계3]임금총액의 월지급액 */}
            {workerStep === 3 && (
              <div className="space-y-4">
                <h3 className="font-bold text-base mb-1">{clauseOf('payment', formData, clauses).title}</h3>
                <ClauseBody clauseKey="payment" formData={formData} clauses={clauses} className="pl-4 text-base" />
                <div className="pl-4 text-sm bg-gray-50 border rounded p-2"><WageBreakdown formData={formData} /></div>
                <ClauseBody clauseKey="paymentNotes" formData={formData} clauses={clauses} className="pl-4 text-base" />
              </div>
            )}

            {/* ⭐ [단계4]임금총액의 성격과 준수사항 */}
            {workerStep === 4 && (
              <div className="space-y-4">
                <h3 className="font-bold text-base mb-1">{clauseOf('nature', formData, clauses).title}</h3>
                <ClauseBody clauseKey="nature" formData={formData} clauses={clauses} className="pl-4 text-base" />
              </div>
            )}

            {/* ⭐ [단계5]전자임금계약 체결 동의서 / [단계6]계약서 교부 확인 — ConsentDoc이 조항템플릿
                 시트(consent1/2 키)를 참조. 근로자 화면이라 edit(수정 탭 전용)은 넘기지 않는다. */}
            {(workerStep === 5 || workerStep === 6) && (
              <div className="space-y-4">
                <ConsentDoc docIndex={workerStep - FIRST_SIGN_STEP} formData={formData} clauses={clauses} variant="step" />
                <p className="font-bold text-center">위 내용에 동의하며 서명합니다.</p>
                <SignaturePad canvasRef={canvasRef} startDraw={startDraw} moveDraw={moveDraw} setIsDrawing={setIsDrawing} clearCanvas={clearCanvas} />
              </div>
            )}
            
            {/* ⭐ [단계7]전체 계약서 확인 후 최종 서명 */}
            {workerStep === LAST_WORKER_STEP && (
              <div className="space-y-6">
                <div className="font-bold text-lg text-center bg-yellow-100 p-4 rounded-lg border border-yellow-300">💡 아래 전체 계약 내용을 다시 한번 꼼꼼히 확인한 뒤 최종 서명해 주세요.</div>
                <div className="bg-white border-2 border-gray-400 p-4 rounded h-96 overflow-y-scroll text-xs leading-relaxed">
                  <WageContractDocument formData={formData} clauses={clauses} signatures={signatures} sealImg={null} />
                </div>
                <div className="mt-4">
                  <p className="font-bold text-center mb-2">최종 서명 (계약 체결)</p>
                  <SignaturePad canvasRef={canvasRef} startDraw={startDraw} moveDraw={moveDraw} setIsDrawing={setIsDrawing} clearCanvas={clearCanvas} />
                </div>
              </div>
            )}
          </div>

          {/* ⭐ 최종완료버튼*/}
          <div className="fixed bottom-0 left-0 right-0 p-4 z-20 border-t bg-white flex gap-3 shadow-lg">
            {workerStep > 1 && <button onClick={()=>setWorkerStep(workerStep-1)} className="flex-1 py-5 bg-gray-200 text-gray-700 font-bold rounded-lg text-lg hover:bg-gray-300">이전</button>}
            {workerStep < FIRST_SIGN_STEP && (<button onClick={() => setWorkerStep(workerStep + 1)} className="py-5 flex-[2] bg-blue-600 text-white font-bold rounded-lg shadow-lg text-lg hover:bg-blue-700 flex justify-center items-center gap-2">다음 내용 확인 <ChevronRight className="ml-2"/></button>)}
            {workerStep >= FIRST_SIGN_STEP && workerStep < LAST_WORKER_STEP && (<button onClick={() => saveSignatureAndNext(signKeyForStep(workerStep))} className="py-5 flex-[2] bg-green-600 text-white font-bold rounded-lg shadow-lg text-lg hover:bg-green-700 flex justify-center items-center gap-2">서명 저장 후 다음 <ChevronRight className="ml-2"/></button>)}
            {workerStep === LAST_WORKER_STEP && (<button onClick={finalSubmit} className="py-5 flex-[2] bg-blue-600 text-white font-bold rounded-lg shadow-lg text-lg hover:bg-blue-700 flex justify-center items-center gap-2">최종 제출 및 완료</button>)}
          </div>
        </div>
      )}

      {/* ⭐ (관리자)작성 화면 - 패널 */}
      <div className="w-full relative bg-gray-200 min-h-screen flex flex-col">
        {needsAdminGate && !isAdminAuthed && (
          <AdminPasswordGate
            reviewMode={adminReviewMode}
            urlId={urlId}
            onAuthed={pw => { adminPasswordRef.current = pw; setIsAdminAuthed(true); }}
            onDataLoaded={data => {
              setFormData(data);
              setSignatures({ sign1: data.sign1, sign2: data.sign2, sign3: data.sign3 });
              setContractStatus(data.status || 'COMPLETED');
            }}
          />
        )}
        {(step === 1 || (step === 3 && isManagerView && contractStatus === 'SIGNED_BY_WORKER')) && (!needsAdminGate || isAdminAuthed) && (
          <div className="sidebar print-hidden shadow-lg">
            {step === 1 ? (
              <>
                <h2 className="text-xl font-bold mb-6 text-blue-900 flex items-center"><PenTool className="mr-2"/> 고용주 임금계약서 작성</h2>

                {/* ⭐ 작성/수정/설정 탭 */}
                <div className="flex gap-1 mb-6 border-b border-gray-200">
                  {['작성', '수정', '설정', '관리'].map(tab => (
                    <button
                      key={tab}
                      onClick={() => setAdminTab(tab)}
                      className={`px-4 py-2 text-sm font-bold rounded-t-lg -mb-px border-b-2 ${adminTab === tab ? 'border-blue-600 text-blue-600 bg-blue-50' : 'border-transparent text-gray-500 hover:text-gray-700'}`}
                    >
                      {tab}
                    </button>
                  ))}
                </div>

                {adminTab === '작성' && (
                <div className="space-y-6 text-sm">
                  
                  {/* 1. 기본 정보 */}
                  <div className="space-y-4">
                    <div>
                      <label className="font-bold text-gray-700 mb-1 block">계약 법인</label>
                      <select name="companySelect" className="w-full p-2 border rounded bg-white font-bold text-blue-900" onChange={handleChange} value={formData.companyName}>
                        {companies.map(c => <option key={c.name} value={c.name}>{c.name}</option>)}
                      </select>
                    </div>
                    {/* ⭐ 계약 구분 — 계약서 문구는 같고, 계약목록 시트의 '구분' 열로만 남는다. */}
                    <div>
                      <label className="font-bold text-gray-700 mb-1 block">계약 구분</label>
                      <div className="flex gap-6">
                        <label className="flex items-center cursor-pointer"><input type="radio" name="contractKind" value="new" checked={formData.contractKind === 'new'} onChange={handleChange} className="mr-2"/> 신규입사</label>
                        <label className="flex items-center cursor-pointer"><input type="radio" name="contractKind" value="renewal" checked={formData.contractKind === 'renewal'} onChange={handleChange} className="mr-2"/> 연봉갱신</label>
                      </div>
                    </div>
                    <div>
                      <label className="font-bold text-gray-700 mb-1 block">근무지</label>
                      <input name="workPlace" className="w-full p-2 border rounded" value={formData.workPlace} onChange={handleChange} />
                    </div>
                    <div>
                      <label className="font-bold text-gray-700 mb-1 block">계약 작성일</label>
                      <input type="date" name="signingDate" className="w-full p-2 border rounded bg-gray-50" value={formData.signingDate} onChange={handleChange} />
                    </div>
                    <div>
                      <label className="font-bold text-gray-700 mb-1 block">임금계약기간</label>
                      <div className="flex items-center gap-2">
                        <input type="date" name="contractStart" className="w-1/2 p-2 border rounded text-blue-900 bg-blue-50 font-bold" value={formData.contractStart} onChange={handleChange} />
                        <span className="text-gray-400">~</span>
                        <input type="date" name="contractEnd" className="w-1/2 p-2 border rounded text-blue-900 bg-blue-50 font-bold" value={formData.contractEnd} onChange={handleChange} />
                      </div>
                      <p className="text-xs text-gray-400 mt-1">시작일을 바꾸면 종료일이 1년 뒤로 자동 계산됩니다(필요하면 종료일만 따로 수정).</p>
                    </div>
                  </div>

                  {/* 5. 근로자 발송 정보 */}
                  <div className="p-4 bg-green-50 rounded border border-green-100">
                    <h3 className="font-bold text-green-800 mb-3">근로자 발송 정보</h3>

                    <p className="text-xs text-gray-500 mb-3">입사년도·근로유형·월지급액은 근로자마다 따로 입력합니다. 오른쪽 미리보기는 지금 입력 중인 근로자 기준입니다.</p>
                    {workerList.map((w, i) => (
                      <WorkerCard
                        key={w.key} w={w} index={i} count={workerList.length}
                        wageTypes={wageTypes} minimumWage={minimumWage}
                        isPreview={w.key === previewWorker.key}
                        onPreview={() => setPreviewKey(w.key)}
                        onUpdate={patch => updateWorker(w.key, patch)}
                        onRemove={() => removeWorker(w.key)}
                        onMonthlyChange={digits => handleWorkerMonthlyChange(w, digits)}
                        onWageTypeChange={t => handleWorkerWageTypeChange(w, t)}
                        onToggleManual={on => handleWorkerToggleManual(w, on)}
                        autoHyphenPhone={autoHyphenPhone}
                      />
                    ))}

                    <button onClick={addWorker} className="w-full text-blue-600 border border-blue-300 bg-white py-2 rounded mt-2 hover:bg-blue-50 font-bold">+ 근로자 추가</button>
                  </div>

                  <button onClick={handleSend} className="w-full py-4 bg-blue-600 text-white font-bold rounded-lg shadow-lg hover:bg-blue-700 flex justify-center items-center text-lg"><Send className="mr-2"/> 발송하기</button>
                </div>
                )}

                {adminTab === '설정' && (
                  <>
                    <SettingsPanel companies={companies} setCompanies={setCompanies} defaults={defaults} setDefaults={setDefaults} wageTypes={wageTypes} />
                    <MessageTemplateEditor messageTemplate={messageTemplate} setMessageTemplate={setMessageTemplate} touchedRef={messageTemplateTouchedRef} />
                  </>
                )}
                {adminTab === '관리' && (<AdminAccountPanel />)}
                {adminTab === '수정' && (
                  <ClauseEditorPanel
                    clauses={clauses}
                    setClauses={setClauses}
                    editingClauseNum={editingClauseNum}
                    setEditingClauseNum={setEditingClauseNum}
                    editableTitleRef={editableTitleRef}
                    editableBodyRef={editableBodyRef}
                    draggedChipRef={draggedChipRef}
                  />
                )}
              </>
            ) : (
              <div className="flex flex-col items-center w-full h-full justify-center mt-20">
                  <div className="mb-4 bg-blue-100 p-4 rounded-full">
                    <PenTool className="w-10 h-10 text-blue-600"/>
                  </div>

                  {/* ⭐ (관리자)최종 승인 요청 */}
                  <h2 className="text-2xl font-bold text-gray-800 mb-2">관리자 승인 대기</h2>
                  <p className="text-gray-500 mb-6 break-keep text-center">
                    근로자 서명이 완료되었습니다.<br/>
                    계약 내용을 최종 확인하신 후 아래 버튼을 눌러 승인(직인 날인)해 주세요.
                  </p>
                  <button onClick={managerApprove} className="w-full px-6 py-4 bg-blue-600 text-white rounded-lg font-bold hover:bg-blue-700 shadow-lg text-lg">
                      승인 및 직인 날인
                  </button>
              </div>
            )}
          </div>
        )}

        {/* ⭐ 완성본*/}
        {(step === 1 || (step === 3 && !(contractStatus === 'SIGNED_BY_WORKER' && !isManagerView))) && (!needsAdminGate || isAdminAuthed) && (
          <div className={`main-preview ${(step === 1 || (step === 3 && isManagerView && contractStatus === 'SIGNED_BY_WORKER')) ? 'has-sidebar' : ''} ${(step === 3 && contractStatus === 'COMPLETED') ? 'hidden print:flex' : ''}`} id="print-area">
            <div className="a4-page mobile-scale relative">
              {/* ⭐ 수정 탭에서만 edit을 넘긴다 — 고른 문구가 이 계약서 위에서 바로 수정 가능해진다. */}
              <WageContractDocument
                formData={previewData}
                clauses={clauses}
                signatures={signatures}
                sealImg={contractStatus === 'COMPLETED' ? sealImages[formData.companyName] : null}
                edit={(step === 1 && adminTab === '수정') ? { editingClauseNum, editableTitleRef, editableBodyRef, draggedChipRef } : null}
              />
            </div>
          </div>
        )}

        {/* ⭐ 근로자 전송 완료&최종 계약 완료*/}
        {step === 3 && (contractStatus === 'COMPLETED' || (!isManagerView && contractStatus === 'SIGNED_BY_WORKER')) && (
            <div className="w-full min-h-screen bg-gray-100 flex flex-col justify-center items-center p-6 z-10 text-center print:hidden">
                {contractStatus === 'COMPLETED' ? (
                    <div className="flex flex-col items-center w-full max-w-sm">
                      <CheckCircle className="w-16 h-16 text-green-500 mb-4"/>
                      <h2 className="text-2xl font-bold text-gray-800 mb-2">계약 완료</h2>
                      <p className="text-gray-500 mb-6 break-keep">최종 승인 및 직인 날인이 완료되었습니다.</p>
                      {sealReady ? (
                        <button onClick={()=>{const isWebView = /KAKAOTALK|NAVER|Daum|Instagram|Line/i.test(navigator.userAgent);
                          if (isWebView) { alert("현재 사용 중인 메일 앱 내부에서는 PDF 저장이 차단되어 있습니다.\n다른 브라우저(Safari, Chrome)를 이용해 주세요."); }
                          window.print();}}
                          className="w-full px-6 py-4 bg-gray-800 text-white rounded-lg font-bold hover:bg-gray-900 shadow-lg text-lg">
                            <Printer className="inline mr-2"/> PDF 저장
                        </button>
                      ) : (
                        // ⭐ 직인 조회가 아직 끝나지 않은 상태 — 이 버튼이 보이기 전에 눌러서
                        //   window.print()가 직인 없이 찍히는 것을 막기 위해 여기서 기다린다.
                        <p className="text-sm text-gray-400">직인 확인 중...</p>
                      )}
                    </div>
                ) : (
                    <div className="flex flex-col items-center w-full max-w-sm">
                        <div className="mb-4 bg-yellow-100 p-4 rounded-full"><Lock className="w-10 h-10 text-yellow-600"/></div>
                        <h2 className="text-2xl font-bold text-gray-800 mb-2">전송 완료</h2>
                        <p className="text-gray-500 font-bold mb-2">담당자에게 서명된 계약서가 전달되었습니다.</p>
                        <p className="text-sm text-gray-400">최종 승인 및 직인 날인이 끝나면 완료 링크를 문자 또는 메일로 보내드립니다.</p>
                    </div>
                )}
            </div>
        )}
      </div>
    </div>
  );
};

ReactDOM.render(<App />, document.getElementById('root'));
</script>
</body>
</html>
