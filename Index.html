<body>
<input type="hidden" id="data-contract-id" value="<?= contractId ?>" />

<script type="text/babel">
  const { useState, useRef, useEffect } = React;

  // 아이콘
  const IconBase = ({ children, className }) => (<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={`inline-block ${className || ''}`}>{children}</svg>);
  const Lock = ({ className }) => <IconBase className={className}><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></IconBase>;
  const CheckCircle = ({ className }) => <IconBase className={className}><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></IconBase>;
  const PenTool = ({ className }) => <IconBase className={className}><path d="M12 19l7-7 3 3-7 7-3-3z"></path><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"></path><path d="M2 2l7.586 7.586"></path><circle cx="11" cy="11" r="2"></circle></IconBase>;
  const Send = ({ className }) => <IconBase className={className}><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></IconBase>;
  const Printer = ({ className }) => <IconBase className={className}><polyline points="6 9 6 2 18 2 18 9"></polyline><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2-2v5a2 2 0 0 1-2 2h-2"></path><rect x="6" y="14" width="12" height="8"></rect></IconBase>;
  const Eraser = ({ className }) => <IconBase className={className}><path d="M2.9 15.8a1 1 0 0 0-.9 1.2l2.5 9A1 1 0 0 0 5.6 27h12.8a1 1 0 0 0 1-1l2.5-9a1 1 0 0 0-.9-1.2c-1.1-.3-2.3-.5-3.5-.5s-2.4.2-3.5.5c-1.1.3-2.3.5-3.5.5s-2.4-.2-3.5-.5z" transform="translate(-2 -2) scale(0.9)"/></IconBase>;
  const ChevronRight = ({ className }) => <IconBase className={className}><polyline points="9 18 15 12 9 6"></polyline></IconBase>;

  // ⭐ 계약일 표기 — WageContractDocument(아래, App 바깥에 정의됨)에서도 쓰기 때문에 App 안이 아니라
  //   여기(모듈 스코프)로 옮겨뒀다. App 내부에서 쓰던 곳들도 그대로 이 함수를 참조한다.
  const formatDate = (d) => {
    if (!d) return "      년      월      일";
    let s = d;
    if (typeof d === 'object') {
      if (d.toISOString) s = d.toISOString().split('T')[0];
      else return String(d);
    }
    const p = String(s).split('-');
    if (p.length < 3) return s;
    return `${p[0]}년 ${p[1]}월 ${p[2]}일`;
  };

  // ⭐ 수정 탭에서 조항 본문에 끌어다 넣을 수 있는 변수 블록 목록. token은 실제 formData 필드명,
  //   label은 관리자 화면/칩에 보이는 직관적인 한글 이름이다. 조항 본문 저장값 안에서는
  //   {{token}} 형태로 들어가 있다가, 실제 계약서를 그릴 때 계약 데이터 값으로 치환된다.
  //   금액 변수(연봉/월지급액/시급)는 clauseVars()에서 천 단위 콤마를 붙인 값으로 바뀐다.
  const VARIABLE_FIELDS = [
    { token: 'companyName', label: '회사명' },
    { token: 'workPlace', label: '근무지' },
    { token: 'empName', label: '근로자성명' },
    { token: 'joinYear', label: '입사년도' },
    { token: 'annualTotal', label: '연봉' },
    { token: 'monthlyTotal', label: '월지급액' },
    { token: 'hourlyWage', label: '시급' },
  ];

  // ⭐ 조항 본문에 들어있는 {{token}} 자리표시자를 실제 값으로 바꾼다. 본문 자체(관리자가 수정
  //   탭에서 입력한 HTML, <br/> 등)는 그대로 신뢰하지만, 치환되는 값(근무장소 등 계약마다 달라지는
  //   자유 입력값)은 HTML로 잘못 해석되지 않도록 이스케이프한다.
  const escapeHtmlValue = (str) => String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  const substituteVariables = (template, formData) => {
    if (!template) return '';
    return template.replace(/\{\{(\w+)\}\}/g, (_, token) => {
      const val = formData ? formData[token] : undefined;
      return (val === undefined || val === null || val === '') ? '' : escapeHtmlValue(val);
    });
  };

  // ⭐ 조항 키 하나를 받아 {title, html}을 돌려주는 범용 헬퍼. WageContractDocument(최종
  //   미리보기/근로자 7단계)와 근로자 단계별 확인화면(1~6단계)이 보여주는 틀은 서로
  //   다르지만, 실제로 가져오는 title/본문 데이터는 이 함수 하나로만
  //   거치게 해서 "수정 탭에서 바꾸면 어디서든 똑같이 보인다"를 보장한다.
  const resolveClause = (num, fallbackTitle, fallbackBody, formData, clauses) => {
    const c = clauses && clauses[String(num)];
    const title = c ? c.title : fallbackTitle;
    const html = substituteVariables(c ? c.body : fallbackBody, formData);
    return { title, html };
  };

  // ⭐ 수정 탭에서 실제로 고칠 수 있는 문구 목록. 임금계약기간 행과 월지급액 세부내역 표,
  //   서명란은 표 구조라 제외. consent1/2는 근로자 서명 단계(5·6단계)에 쓰이는 2종 동의서 —
  //   조항템플릿 시트를 그대로 재사용하되 문자열 키만 다르게 쓴다.
  const EDITABLE_CLAUSE_NUMS = ['preamble', 'total', 'retirement', 'payment', 'paymentNotes', 'nature', 'consent1', 'consent2'];
  // ⭐ 수정 탭 선택 버튼에 표시할 이름.
  const CLAUSE_SELECTOR_LABELS = {
    preamble: '머리말',
    total: '임금총액',
    retirement: '퇴직금',
    payment: '월지급액(1~2)',
    paymentNotes: '월지급액(3~8)',
    nature: '성격·준수사항',
    consent1: '전자계약 동의서',
    consent2: '교부확인',
  };
  const clauseSelectorLabel = (num) => CLAUSE_SELECTOR_LABELS[num] || num;

  // ⭐ 변수 칩 하나의 HTML. 자리표시자 → 칩으로 바꿔 보여줄 때(templateToEditorHtml)와
  //   본문에 새 칩을 끌어다 놓을 때(insertVariableChipAtCaret)가 모두 이 함수를 쓴다.
  const buildChipHtml = (token, label) =>
    `<span contenteditable="false" data-token="${token}" class="inline-flex items-center gap-1 bg-blue-100 text-blue-800 text-xs font-bold px-2 py-0.5 rounded-full mx-0.5 align-middle">${escapeHtmlValue(label)}<button type="button" class="chip-delete ml-0.5 text-blue-500 hover:text-red-600" aria-label="삭제">×</button></span>`;

  // ⭐ 저장된 본문({{token}} 자리표시자가 섞인 일반 텍스트/HTML)을 계약서 본문 위에서 직접
  //   수정할 때 보여줄 형태로 바꾼다. {{token}} 자리를 "칩"(삭제 버튼이 달린 변수 블록)으로.
  //   fields는 어떤 변수 목록 중에서 라벨을 찾을지(조항 편집=VARIABLE_FIELDS, 발송
  //   메시지 편집=MESSAGE_VARIABLE_FIELDS) — 기본값은 조항 편집 쪽과 호환되게 유지한다.
  const templateToEditorHtml = (template, fields = VARIABLE_FIELDS) => {
    if (!template) return '';
    return template.replace(/\{\{(\w+)\}\}/g, (_, token) => {
      const field = fields.find(v => v.token === token);
      return buildChipHtml(token, field ? field.label : token);
    });
  };

  // ⭐ 에디터의 현재 DOM(텍스트 + 칩 span)을 저장용 문자열로 되돌린다 — 칩은 다시 {{token}}으로.
  const serializeEditorHtml = (rootEl) => {
    const clone = rootEl.cloneNode(true);
    clone.querySelectorAll('[data-token]').forEach(chip => {
      chip.replaceWith(document.createTextNode('{{' + chip.getAttribute('data-token') + '}}'));
    });
    return clone.innerHTML;
  };

  // ⭐ 수정 탭(조항 본문 — 계약서 쪽)과 설정 탭(발송 메시지)이 공유하는 드래그앤드롭/칩
  //   핸들러들. 어느 쪽이든 "사이드바의 변수 블록을 끌어다 본문에 놓는다"는 동작이 같아서
  //   모듈 스코프에 둔다. draggedChipRef는 각 화면의 상위 컴포넌트가 만들어 내려준다.
  const insertVariableChipAtCaret = (field) => {
    document.execCommand('insertHTML', false, buildChipHtml(field.token, field.label));
  };
  const handleEditableBodyDrop = (e, draggedChipRef, fields = VARIABLE_FIELDS) => {
    e.preventDefault();
    const token = e.dataTransfer.getData('text/x-variable-token');
    if (token) {
      const field = fields.find(v => v.token === token);
      if (field) insertVariableChipAtCaret(field);
    }
    if (draggedChipRef) draggedChipRef.current = null;
  };
  const handleEditableBodyDragStart = (e, draggedChipRef) => {
    const chip = e.target.closest && e.target.closest('[data-token]');
    if (chip && draggedChipRef) { draggedChipRef.current = chip; e.dataTransfer.setData('text/x-existing-chip', '1'); }
  };
  const handleEditableBodyClick = (e) => {
    const delBtn = e.target.closest && e.target.closest('.chip-delete');
    if (delBtn) {
      const chip = delBtn.closest('[data-token]');
      if (chip) chip.remove();
    }
  };

  // ⭐ 발송 메시지(이메일/문자 공용) 편집 — 조항 본문과 달리 저장되는 값이 HTML이 아니라
  //   실제 메일/문자에 그대로 들어가는 "순수 텍스트"(줄바꿈은 \n)라서, 조항 편집의
  //   templateToEditorHtml/serializeEditorHtml을 그대로 쓸 수 없고 별도 변환이 필요하다.
  const MESSAGE_VARIABLE_FIELDS = [
    { token: 'workerName', label: '근로자성명' },
    { token: 'companyName', label: '법인명' },
    { token: 'link', label: '접속링크' },
    { token: 'managerName', label: '담당자명' },
    { token: 'managerPhone', label: '담당자연락처' },
    { token: 'managerEmail', label: '담당자이메일' },
  ];
  // ⭐ 순수 텍스트 템플릿 → 에디터용 HTML. \n은 <br/>로, {{token}}은 칩으로. 원문 중 &<> 같은
  //   문자가 있어도 깨지지 않도록 먼저 이스케이프한 뒤 줄바꿈/칩 변환을 적용한다.
  const messageTemplateToEditorHtml = (template, fields) => {
    if (!template) return '';
    const withBreaks = escapeHtmlValue(template).replace(/\n/g, '<br/>');
    return withBreaks.replace(/\{\{(\w+)\}\}/g, (_, token) => {
      const field = fields.find(v => v.token === token);
      return buildChipHtml(token, field ? field.label : token);
    });
  };
  // ⭐ Enter를 누르면 브라우저마다 제각각(<div>/<p>)으로 줄을 나누는 대신, 항상 <br>
  //   하나만 삽입하도록 강제한다 — 그래야 아래 serializeMessageBody가 줄바꿈을 안정적으로
  //   \n 하나로 되돌릴 수 있다.
  const handleMessageBodyKeyDown = (e) => {
    if (e.key === 'Enter') { e.preventDefault(); document.execCommand('insertLineBreak'); }
  };
  // ⭐ 에디터 DOM → 저장용 순수 텍스트. 칩은 {{token}}으로, <br>은 \n으로 되돌린 뒤
  //   textContent로 나머지(일반 텍스트)를 그대로 가져온다.
  const serializeMessageBody = (rootEl) => {
    const clone = rootEl.cloneNode(true);
    clone.querySelectorAll('[data-token]').forEach(chip => {
      chip.replaceWith(document.createTextNode('{{' + chip.getAttribute('data-token') + '}}'));
    });
    clone.querySelectorAll('br').forEach(br => br.replaceWith(document.createTextNode('\n')));
    return clone.textContent;
  };

  // ⭐ 계약 종료일 계산(시작일 + N개월 - 1일).
  //   new Date(start)로 파싱하면 UTC 자정으로 해석되는데, 그 다음 setMonth/setDate는
  //   브라우저의 "로컬" 시간대 기준으로 동작해서 UTC보다 느린 시간대(예: 미국)에서 열면
  //   종료일이 하루 밀릴 수 있었다. Date.UTC + setUTCDate로 전부 UTC 기준으로만 계산한다.
  const calcEnd = (start, months) => {
    if(!start || !months) return '';
    const [y, m, day] = start.split('-').map(Number);
    const d = new Date(Date.UTC(y, (m - 1) + parseInt(months), day));
    d.setUTCDate(d.getUTCDate() - 1);
    return d.toISOString().split('T')[0];
  };

  // ⭐ 오늘 날짜(YYYY-MM-DD, 브라우저 로컬 기준). toISOString()은 UTC라 한국 오전 9시 전에는
  //   어제 날짜가 나와서 직접 만든다.
  const localDateStr = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  const TODAY = localDateStr(new Date());

  // ⭐ 임금테이블에서 채워지는 값들 — 근로유형/월지급액이 바뀌면 이 값으로 비운 뒤 다시 조회한다.
  const EMPTY_WAGE = { annualTotal: 0, monthlyTotal: 0, hourlyWage: 0, baseWage: 0, overtimeWage: 0, nightWage: 0, baseHours: 0, overtimeHours: 0, nightHours: 0 };

  // ⭐ 근로자 단계: 1 계약 당사자 · 2 계약기간/임금총액/퇴직금 · 3 월지급액 · 4 성격과 준수사항
  //   · 5 전자계약 동의서 서명(sign1) · 6 교부확인 서명(sign2) · 7 전체 확인 후 최종 서명(sign3)
  const FIRST_SIGN_STEP = 5;
  const LAST_WORKER_STEP = 7;
  const signKeyForStep = (st) => `sign${st - FIRST_SIGN_STEP + 1}`;

  // ⭐ 금액 표기(천 단위 콤마, 소수점 버림) — 예전 임금계약서의 f()와 같다.
  const fmtWon = (num) => Math.floor(Number(num) || 0).toLocaleString();

  // ⭐ 조항템플릿 시트를 아직 못 불러왔거나(로드 전) 시트에 없을 때 쓰는 기본 문구.
  //   Code.gs의 CLAUSE_SEED_DEFAULTS와 문구가 같아야 한다(시트 최초 생성 시 그쪽 값이 들어감).
  //   예전 임금계약서 화면과 미리보기 사이에 달랐던 표기("가입한다"/"기입한다", "적용하지"/
  //   "적용되지", "5 별도의" 마침표 누락, 동의서의 "근로계약서" 표기)는 한쪽으로 통일했다.
  const CLAUSE_DEFAULTS = {
    preamble: { title: '머리말', body: '아래의 근로조건을 성실히 이행할 것을 약정하고 임금계약을 체결한다.' },
    total: { title: '임금총액(1년기준)', body: '1. 임금총액: 연간 {{annualTotal}}원 (월 <span style="background-color:#fef08a;font-weight:bold;padding:0 8px;">{{monthlyTotal}}원</span>) 갑근세 등을 공제하기 전 금액임<br/>2. 임금총액에는 기본급, 연장수당, 야간수당 등이 포함되어 있다.' },
    retirement: { title: '퇴직금', body: '1. 퇴직금은 계속근로년수 1년 이상인 근로자에게 퇴직시 지급하거나 퇴직연금에 가입한다.<br/>2. 1주간 소정근로시간이 15시간 미만인 경우 퇴직금 규정은 적용하지 아니한다.' },
    payment: { title: '임금총액의 월지급액', body: '1. 임금총액의 월지급액(월급액)은 기본급 등의 1/12한 금액을 매월 10일에 "을"에게 통장계좌로 지급한다.<br/>2. 임금총액의 월지급액의 구체적인 내역은 다음과 같다.(시급: {{hourlyWage}}원)' },
    paymentNotes: { title: '월지급액 기타사항', body: '3. 월지급액은 매월 1일에서 기산하여 말일에 마감한다.<br/>4. 임금총액에 포함되는 시간 외 근로시간을 초과하여 근로하는 경우 추가연장수당을 지급한다.<br/>5. 별도의 성과급 지급 기준에 의거 성과급을 지급할 수 있다.(단, 지급일에 근속중인 직원에 한한다.)<br/>6. 포괄임금제(고정연장수당 및 고정야간근로수당)로 지급함에 동의한다.<br/>7. 결근, 지각, 조퇴 등 근로하지 않은 기간은 일수 또는 시간에 비례한 금액을 공제할 수 있으며, 결근의 경우 해당 주의 주휴수당을 공제할 수 있다.<br/>8. 중도입사, 중도퇴사의 경우 월임금은 일할 산정하여 지급한다.' },
    nature: { title: '임금총액의 성격과 준수사항', body: '임금총액은 {{companyName}}의 규정과 상사의 지시에 따른 본인의 근로제공에 대한 모든 금전적 보상임을 확인하며 직원상호간 비밀의무를 준수한다. 만약 이를 타인에게 인지시킬 수 있는 어떠한 행위도 하지 않을 것이며, 이를 어길시에는 어떠한 처벌도 감수할 것을 서약한다.' },
    consent1: { title: '전자임금계약 체결 동의서', body: '1) 「전자문서 및 전자거래 기본법」 제4조 제1항에 따라, 본 임금계약서를 전자적 형태(URL 접속 및 전자서명)로 작성 및 체결하는 것에 동의합니다.<br/>2) 「전자서명법」 제3조 제1항 및 제2항에 따라, 본인이 등록한 전자서명이 자필 서명 또는 날인과 동일한 법적 효력을 가짐을 인정합니다.<br/>3) 「전자서명법」 제18조에 근거하여 본인 인증(휴대폰 번호 등)에 대한 관리 의무 및 보안 책임을 확인합니다.<br/>4) 「근로기준법」 제17조 제2항에 따라 임금계약서의 전자적 방법(이메일 또는 링크 등)을 통한 교부에 동의합니다.' },
    consent2: { title: '계약서 교부 확인', body: '근로자 본인은 위 내용을 충분히 숙지하였으며, 그 내용에 동의하며 임금계약서 사본 또는 부본을 교부받았음을 확인합니다.' },
  };

  // ⭐ 조항 치환에 쓰는 값 — 금액은 콤마를 붙인 문자열로 바꿔서 넘긴다.
  const clauseVars = (formData) => ({
    ...formData,
    annualTotal: fmtWon(formData.annualTotal),
    monthlyTotal: fmtWon(formData.monthlyTotal),
    hourlyWage: fmtWon(formData.hourlyWage),
  });

  const clauseOf = (key, formData, clauses) => {
    const d = CLAUSE_DEFAULTS[key];
    return resolveClause(key, d.title, d.body, clauseVars(formData), clauses);
  };

  // ⭐ 조항 제목/본문 한 칸. edit(관리자 수정 탭 전용 — 근로자 화면에는 절대 전달하지 않음)의
  //   editingClauseNum이 이 조항이면 계약서 위에서 바로 글을 쓰는 느낌으로 contentEditable이
  //   된다. 제목/본문 ref는 App에서 만들어 사이드바(ClauseEditorPanel)의 저장 버튼과 공유한다.
  const ClauseTitle = ({ clauseKey, formData, clauses, edit }) => {
    const { title } = clauseOf(clauseKey, formData, clauses);
    if (edit && edit.editingClauseNum === clauseKey) {
      return (
        <span
          ref={edit.editableTitleRef}
          contentEditable
          suppressContentEditableWarning
          className="inline-block min-w-[2em] outline-none border-b border-dashed border-blue-500 bg-blue-50"
        >{title}</span>
      );
    }
    return <>{title}</>;
  };

  const ClauseBody = ({ clauseKey, formData, clauses, edit, className }) => {
    if (edit && edit.editingClauseNum === clauseKey) {
      const savedBody = clauses && clauses[clauseKey] ? clauses[clauseKey].body : CLAUSE_DEFAULTS[clauseKey].body;
      return (
        <div
          ref={edit.editableBodyRef}
          contentEditable
          suppressContentEditableWarning
          dangerouslySetInnerHTML={{ __html: templateToEditorHtml(savedBody) }}
          onClick={handleEditableBodyClick}
          onDrop={e => handleEditableBodyDrop(e, edit.draggedChipRef)}
          onDragOver={e => e.preventDefault()}
          onDragStart={e => handleEditableBodyDragStart(e, edit.draggedChipRef)}
          className={`outline-none bg-blue-50 ring-2 ring-blue-400 rounded px-1 ${className || ''}`}
        />
      );
    }
    const { html } = clauseOf(clauseKey, formData, clauses);
    return <div className={className} dangerouslySetInnerHTML={{ __html: html }} />;
  };

  // ⭐ "사용자/근로자 정보" 머리글 표 — 근로자 1단계·7단계(최종 확인)·최종 미리보기/인쇄 화면이
  //   모두 이 컴포넌트 하나를 쓴다. 칸 구성은 예전 임금계약서와 같다(주민등록번호·입사년도 포함).
  const PartyInfoTable = ({ formData }) => (
    <table className="c-table mb-4 text-sm">
      <tbody>
        <tr><td rowSpan="3" className="bg-gray-label w-20">사용자<br/>("갑")</td><td className="bg-gray-label w-20">명 칭</td><td colSpan="3" className="pl-4 font-bold">{formData.companyName}</td></tr>
        <tr><td className="bg-gray-label">주 소</td><td colSpan="3" className="pl-4">{formData.companyAddress}</td></tr>
        <tr><td className="bg-gray-label">전화번호</td><td colSpan="3" className="pl-4">{formData.companyPhone}</td></tr>
        <tr>
          <td rowSpan="3" className="bg-gray-label">근로자<br/>("을")</td><td className="bg-gray-label">성 명</td><td className="pl-4">{formData.empName}</td>
          <td className="bg-gray-label hl-yellow w-28">주민등록번호</td><td className="text-center w-40">{formData.empRegNumber}</td>
        </tr>
        <tr><td className="bg-gray-label">주 소</td><td colSpan="3" className="pl-4">{formData.empAddress}</td></tr>
        <tr>
          <td className="bg-gray-label">전화번호</td><td className="pl-4">{formData.empPhone}</td>
          <td className="bg-gray-label">입사년도</td><td className="text-center font-bold hl-yellow">{formData.joinYear}</td>
        </tr>
      </tbody>
    </table>
  );

  // ⭐ 월지급액 세부내역(기본급/연장수당/야간수당/합계) — 임금테이블 시트에서 불러온 값.
  const WageBreakdown = ({ formData }) => (
    <table className="plain-table my-2">
      <tbody>
        <tr><td className="w-40">- 기본급의 월지급액 :</td><td className="text-right font-bold">{fmtWon(formData.baseWage)}원</td><td className="w-44">(월간 {formData.baseHours} 시간분)</td></tr>
        <tr><td>- 연장수당 :</td><td className="text-right font-bold">{fmtWon(formData.overtimeWage)}원</td><td>(월간 {formData.overtimeHours} 초과시간분)</td></tr>
        <tr><td>- 야간수당 :</td><td className="text-right font-bold">{fmtWon(formData.nightWage)}원</td><td>(월간 {formData.nightHours} 시간분)</td></tr>
        <tr><td className="text-right">월지급액합계</td><td className="text-right font-bold border-t border-black">{fmtWon(formData.monthlyTotal)}원</td><td></td></tr>
      </tbody>
    </table>
  );

  // ⭐ "- 아 래 -" 이하 임금 조건 표. 근로자 단계별 화면(2~4단계)은 같은 ClauseBody를 쪼개서
  //   보여주고, 최종 확인(7단계)·미리보기/인쇄는 이 표 하나를 쓴다 — 문구 원본은 어디서든 한 곳.
  const WageTermsTable = ({ formData, clauses, edit, className }) => {
    const P = { formData, clauses, edit };
    return (
      <table className={`c-table ${className || ''}`}>
        <colgroup><col className="w-32"/><col/></colgroup>
        <tbody>
          <tr className="keep-together">
            <td className="bg-gray-label">임금계약기간</td>
            <td className="text-center font-bold hl-yellow">{formatDate(formData.contractStart)} ~ {formatDate(formData.contractEnd)}</td>
          </tr>
          <tr className="keep-together"><td className="bg-gray-label"><ClauseTitle clauseKey="total" {...P}/></td><td><ClauseBody clauseKey="total" {...P}/></td></tr>
          <tr className="keep-together"><td className="bg-gray-label"><ClauseTitle clauseKey="retirement" {...P}/></td><td><ClauseBody clauseKey="retirement" {...P}/></td></tr>
          <tr className="keep-together">
            <td className="bg-gray-label"><ClauseTitle clauseKey="payment" {...P}/></td>
            <td>
              <ClauseBody clauseKey="payment" {...P}/>
              <WageBreakdown formData={formData}/>
              <ClauseBody clauseKey="paymentNotes" {...P}/>
            </td>
          </tr>
          <tr className="keep-together"><td className="bg-gray-label"><ClauseTitle clauseKey="nature" {...P}/></td><td><ClauseBody clauseKey="nature" {...P}/></td></tr>
        </tbody>
      </table>
    );
  };

  // ⭐ 근로자 서명 단계(5·6단계)의 동의서 2종 — 조항템플릿 시트(consent1/2 키)를 참조.
  //   variant="step": 근로자 서명 단계 — 파란 박스만, 서명줄 없음(서명 패드가 따로 아래 있음).
  //   variant="full": 관리자 미리보기/최종 확인/인쇄 — 서명줄(근로자명 + 서명 이미지) 포함.
  const CONSENT_KEYS = ['consent1', 'consent2'];
  const ConsentDoc = ({ docIndex, formData, clauses, variant, signatureImg, edit }) => {
    const key = CONSENT_KEYS[docIndex];
    const titleClass = variant === 'full' ? 'font-bold text-base mb-2' : 'font-bold text-lg mb-2 text-blue-900';
    const body = (
      <>
        <h3 className={titleClass}>[<ClauseTitle clauseKey={key} formData={formData} clauses={clauses} edit={edit}/>]</h3>
        <ClauseBody clauseKey={key} formData={formData} clauses={clauses} edit={edit}/>
      </>
    );

    if (variant === 'step') {
      return <div className="border-2 border-blue-500 rounded-lg p-4 bg-blue-50">{body}</div>;
    }

    return (
      <div className="border border-gray-400 rounded-lg p-4 print:border-black print:rounded-none keep-together">
        {body}
        <div className="text-left mt-4 border-t border-gray-200 print:border-black pt-4 flex items-center justify-between">
          <div>
            <span className="mr-2">근로자 :</span>
            <span className="inline-block min-w-[70px] text-center font-bold">{formData.empName}</span>
          </div>
          <span className="text-gray-400 text-sm relative inline-block mr-4">( 서명 또는 인 )
            {signatureImg && <img src={signatureImg} className="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 w-28 h-auto max-w-none object-contain mix-blend-multiply" alt="서명"/>}
          </span>
        </div>
      </div>
    );
  };

  // ⭐ 임금계약서 전체 — 관리자 미리보기/승인/완료 인쇄(#print-area)와 근로자 7단계(최종 확인)가
  //   모두 이 컴포넌트를 쓴다. sealImg는 계약이 COMPLETED일 때만 넘어온다.
  const WageContractDocument = ({ formData, clauses, signatures, sealImg, edit }) => (
    <>
      <div className="flex justify-end mb-2">
        <table className="border-collapse border border-black text-sm">
          <tbody>
            <tr>
              <td className="border border-black px-4 py-1 bg-gray-label">근무지</td>
              <td className="border border-black px-6 py-1 min-w-[100px] text-center">{formData.workPlace}</td>
            </tr>
          </tbody>
        </table>
      </div>

      <h1 className="text-4xl font-extrabold text-center mb-8 underline tracking-widest">임 금 계 약 서</h1>

      <PartyInfoTable formData={formData} />

      <div className="text-center font-bold mb-1"><ClauseBody clauseKey="preamble" formData={formData} clauses={clauses} edit={edit}/></div>
      <div className="text-center font-bold mb-4">- 아 래 -</div>

      <WageTermsTable formData={formData} clauses={clauses} edit={edit} className="mb-6 text-sm leading-relaxed break-keep" />

      <div className="space-y-4 text-sm leading-relaxed text-justify break-keep">
        <ConsentDoc docIndex={0} formData={formData} clauses={clauses} variant="full" signatureImg={signatures.sign1} edit={edit} />
        <ConsentDoc docIndex={1} formData={formData} clauses={clauses} variant="full" signatureImg={signatures.sign2} edit={edit} />
      </div>

      <div className="mt-12 text-center keep-together">
        <div className="text-xl font-bold mb-12 tracking-widest">{formatDate(formData.signingDate)}</div>
        <div className="px-10 text-lg font-bold">
          <div className="text-right mb-8 relative">
            <span className="mr-4">(사용자)</span>
            <span className="mr-2">{formData.companyName}</span>
            <span className="mr-2">대표이사</span>
            <span className="mr-2">{formData.repName}</span>
            <span className="text-gray-400 relative inline-block">
              (인)
              {sealImg && (
                <img src={sealImg} className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[98px] h-[98px] max-w-none object-contain mix-blend-multiply opacity-80" alt="직인" />
              )}
            </span>
          </div>
          <div className="text-right relative mt-8">
            <span className="mr-4">(근로자)</span>
            <span className="mr-2">성 명 :</span>
            <span className="mr-4 inline-block min-w-[80px] text-center border-b border-black">{formData.empName}</span>
            <span className="text-gray-400 text-sm relative inline-block mr-4">(서명 또는 인)
              {signatures.sign3 && <img src={signatures.sign3} className="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 w-28 h-auto max-w-none object-contain mix-blend-multiply" alt="최종서명"/>}
            </span>
          </div>
        </div>
      </div>
    </>
  );

  // ⭐ 설정 탭 — 회사 추가/수정 폼 (회사설정 시트의 7개 필드 전부: 법인명 하나만 바뀌는 게 아니라
  //   주소/대표자/담당자 정보도 함께 바뀔 수 있으므로 한 폼에서 같이 관리한다).
  const CompanyEditForm = ({ draft, setDraft, onSave, onCancel, saving }) => (
    <div className="p-3 bg-yellow-50 border border-yellow-300 rounded space-y-2">
      <input className="w-full p-2 border rounded text-sm" placeholder="법인명" value={draft.name} onChange={e => setDraft({ ...draft, name: e.target.value })} />
      <input className="w-full p-2 border rounded text-sm" placeholder="주소" value={draft.address} onChange={e => setDraft({ ...draft, address: e.target.value })} />
      <input className="w-full p-2 border rounded text-sm" placeholder="전화번호 (예: T.033-644-4467 F.033-644-1944)" value={draft.phone} onChange={e => setDraft({ ...draft, phone: e.target.value })} />
      <input className="w-full p-2 border rounded text-sm" placeholder="대표자" value={draft.rep} onChange={e => setDraft({ ...draft, rep: e.target.value })} />
      <div className="grid grid-cols-3 gap-2">
        <input className="p-2 border rounded text-sm" placeholder="담당자명" value={draft.managerName} onChange={e => setDraft({ ...draft, managerName: e.target.value })} />
        <input className="p-2 border rounded text-sm" placeholder="담당자 연락처" value={draft.managerPhone} onChange={e => setDraft({ ...draft, managerPhone: e.target.value })} />
        <input className="p-2 border rounded text-sm" placeholder="담당자 이메일" value={draft.managerEmail} onChange={e => setDraft({ ...draft, managerEmail: e.target.value })} />
      </div>
      <input className="w-full p-2 border rounded text-sm" placeholder="발신 이메일 (비우면 스크립트 소유자 계정으로 발송)" value={draft.senderEmail || ''} onChange={e => setDraft({ ...draft, senderEmail: e.target.value })} />
      <p className="text-[11px] text-gray-500 leading-tight">발신 이메일은 스크립트 소유자 Gmail의 [설정 → 계정 → 다른 주소에서 메일 보내기]에 등록·인증된 주소여야 합니다.</p>
      <div className="flex gap-2 pt-1">
        <button onClick={onSave} disabled={saving} className="flex-1 py-2 bg-blue-600 text-white rounded font-bold text-sm disabled:opacity-50">{saving ? '저장 중...' : '저장'}</button>
        <button onClick={onCancel} className="flex-1 py-2 bg-gray-200 text-gray-700 rounded font-bold text-sm">취소</button>
      </div>
    </div>
  );

  // ⭐ 관리자 전용 화면(작성/수정/설정 탭, 승인 화면) 입구를 막는 비밀번호 입력 화면.
  //   reviewMode(?mode=review로 들어온 승인 건)일 때는 비밀번호 확인과 동시에 서버에서
  //   계약 데이터를 받아온다(loadSignedDataForAdmin) — 비밀번호를 맞추기 전에는 그 계약의
  //   내용(주민등록번호 등)이 브라우저로 전혀 넘어오지 않는다. 작성 탭(reviewMode=false)은
  //   애초에 빈 화면이라 단순히 통과 여부만 서버에 확인(verifyAdminPassword)한다.
  const AdminPasswordGate = ({ reviewMode, urlId, onAuthed, onDataLoaded }) => {
    const [pw, setPw] = useState('');
    const [err, setErr] = useState('');
    const [checking, setChecking] = useState(false);
    const pwInputRef = useRef(null);

    // ⭐ Apps Script의 google.script.run은 서버에서 하는 일이 거의 없어도(단순 비밀번호
    //   비교라도) 요청당 1~3초 정도 걸리는 게 플랫폼 자체의 특성이다(발송/승인 등 다른
    //   버튼도 동일). 틀렸을 때 유독 더 느리게 "느껴지는" 건 실제로 더 오래 걸려서가
    //   아니라, 1차 시도(실패) + 재입력 + 2차 시도(성공)로 왕복이 두 번 겹치기 때문이다.
    //   그래서 틀렸을 때 입력창을 자동으로 비우고 포커스까지 다시 줘서, 재입력에 걸리는
    //   시간이라도 최대한 줄인다.
    const submit = () => {
      if (!pw || checking) return;
      setErr(''); setChecking(true);
      if (reviewMode) {
        google.script.run.withSuccessHandler(data => {
          setChecking(false);
          if (data === 'WRONG_PASSWORD') {
            setErr('비밀번호가 올바르지 않습니다.');
            setPw('');
            if (pwInputRef.current) pwInputRef.current.focus();
            return;
          }
          if (!data) return setErr('유효하지 않거나 이미 처리된 문서입니다.');
          onDataLoaded(data);
          onAuthed(pw);
        }).withFailureHandler(e => { setChecking(false); setErr('오류가 발생했습니다: ' + e); }).loadSignedDataForAdmin(urlId, pw);
      } else {
        google.script.run.withSuccessHandler(ok => {
          setChecking(false);
          if (!ok) {
            setErr('비밀번호가 올바르지 않습니다.');
            setPw('');
            if (pwInputRef.current) pwInputRef.current.focus();
            return;
          }
          onAuthed(pw);
        }).withFailureHandler(e => { setChecking(false); setErr('오류가 발생했습니다: ' + e); }).verifyAdminPassword(pw);
      }
    };

    return (
      <div className="w-full min-h-screen flex flex-col items-center justify-center bg-gray-100 p-6">
        <div className="w-full max-w-sm bg-white rounded-lg shadow-lg p-8">
          <div className="mb-4 bg-blue-100 p-4 rounded-full w-fit mx-auto"><Lock className="w-8 h-8 text-blue-600" /></div>
          <h2 className="text-xl font-bold text-gray-800 mb-2 text-center">관리자 비밀번호</h2>
          <p className="text-sm text-gray-500 mb-6 text-center">계속하려면 비밀번호를 입력하세요.</p>
          <input
            ref={pwInputRef}
            type="password" autoFocus value={pw} placeholder="비밀번호" disabled={checking}
            onChange={e => { setPw(e.target.value); setErr(''); }}
            onKeyDown={e => { if (e.key === 'Enter') submit(); }}
            className="w-full p-3 border rounded mb-2 disabled:bg-gray-100"
          />
          {err && <p className="text-sm text-red-500 mb-2 font-bold">{err}</p>}
          <button onClick={submit} disabled={checking} className="w-full py-3 bg-blue-600 text-white rounded-lg font-bold hover:bg-blue-700 disabled:opacity-50">
            {checking ? '확인 중...' : '확인'}
          </button>
          {checking && <p className="text-xs text-gray-400 mt-3 text-center">서버 확인에는 보통 1~3초 정도 걸립니다.</p>}
        </div>
      </div>
    );
  };

  // ⭐ 관리 탭 — 관리자 비밀번호 변경. 반드시 기존 비밀번호를 다시 입력해야 바뀐다
  //   (changeAdminPassword가 서버에서 기존 비밀번호를 재확인한 뒤에만 교체).
  const AdminAccountPanel = () => {
    const [current, setCurrent] = useState('');
    const [next, setNext] = useState('');
    const [confirmNext, setConfirmNext] = useState('');
    const [saving, setSaving] = useState(false);
    const [msg, setMsg] = useState(null);

    const submit = () => {
      setMsg(null);
      if (!current) return setMsg({ type: 'err', text: '기존 비밀번호를 입력해 주세요.' });
      if (!next || next.length < 4) return setMsg({ type: 'err', text: '새 비밀번호는 4자 이상이어야 합니다.' });
      if (next !== confirmNext) return setMsg({ type: 'err', text: '새 비밀번호가 서로 일치하지 않습니다.' });
      setSaving(true);
      google.script.run.withSuccessHandler(res => {
        setSaving(false);
        if (res && res.ok) {
          setMsg({ type: 'ok', text: '비밀번호가 변경되었습니다.' });
          setCurrent(''); setNext(''); setConfirmNext('');
        } else {
          setMsg({ type: 'err', text: (res && res.message) || '변경에 실패했습니다.' });
        }
      }).withFailureHandler(err => { setSaving(false); setMsg({ type: 'err', text: '오류: ' + err }); }).changeAdminPassword(current, next);
    };

    return (
      <div className="space-y-4">
        <h3 className="font-bold text-gray-800">관리자 비밀번호 변경</h3>
        <p className="text-xs text-gray-500">작성/수정/설정 탭과 승인 화면에 들어올 때 필요한 비밀번호입니다. 바꾸려면 기존 비밀번호를 먼저 확인해야 합니다.</p>
        <div>
          <label className="text-xs font-bold text-gray-600 block mb-1">기존 비밀번호</label>
          <input type="password" className="w-full p-2 border rounded text-sm" value={current} onChange={e => setCurrent(e.target.value)} />
        </div>
        <div>
          <label className="text-xs font-bold text-gray-600 block mb-1">새 비밀번호</label>
          <input type="password" className="w-full p-2 border rounded text-sm" value={next} onChange={e => setNext(e.target.value)} />
        </div>
        <div>
          <label className="text-xs font-bold text-gray-600 block mb-1">새 비밀번호 확인</label>
          <input type="password" className="w-full p-2 border rounded text-sm" value={confirmNext} onChange={e => setConfirmNext(e.target.value)} />
        </div>
        {msg && <p className={`text-sm font-bold ${msg.type === 'ok' ? 'text-green-600' : 'text-red-500'}`}>{msg.text}</p>}
        <button onClick={submit} disabled={saving} className="w-full py-2 bg-blue-600 text-white rounded font-bold text-sm disabled:opacity-50">{saving ? '변경 중...' : '비밀번호 변경'}</button>
      </div>
    );
  };

  // ⭐ 설정 탭 본체 — 계약 법인(추가/수정/삭제)과 새 계약서 초기값을 관리자 화면에서 직접 관리.
  //   App 안에 중첩해서 정의하면 App이 리렌더될 때마다(=다른 입력 하나만 바꿔도) 함수 참조가
  //   매번 새로 생겨 React가 이 컴포넌트를 통째로 마운트 해제/재마운트해버린다 — 그러면 수정 중인
  //   입력값이 전부 날아간다. 그래서 WageContractDocument처럼 App 바깥(모듈 스코프)에 두고 필요한
  //   값/상태변경 함수를 모두 props로 받는다.
  const SettingsPanel = ({ companies, setCompanies, defaults, setDefaults, wageTypes }) => {
    const [editingIdx, setEditingIdx] = useState(null); // 숫자(회사 인덱스) | 'new' | null
    const [draft, setDraft] = useState(null);
    const [savingCompany, setSavingCompany] = useState(false);
    const [defaultsDraft, setDefaultsDraft] = useState(defaults);
    const [savingDefaults, setSavingDefaults] = useState(false);

    useEffect(() => { if (defaults) setDefaultsDraft(defaults); }, [defaults]);

    const startEdit = (idx) => { setEditingIdx(idx); setDraft({ ...companies[idx] }); };
    const startNew = () => { setEditingIdx('new'); setDraft({ name: '', address: '', phone: '', rep: '', managerName: '', managerPhone: '', managerEmail: '', senderEmail: '' }); };
    const cancelEdit = () => { setEditingIdx(null); setDraft(null); };

    const saveCompany = () => {
      if (!draft.name.trim()) return alert('법인명을 입력해 주세요.');
      const originalName = editingIdx === 'new' ? null : companies[editingIdx].name;
      setSavingCompany(true);
      google.script.run.withSuccessHandler(() => {
        setSavingCompany(false);
        const next = [...companies];
        if (editingIdx === 'new') next.push(draft); else next[editingIdx] = draft;
        setCompanies(next);
        cancelEdit();
      }).withFailureHandler(err => { setSavingCompany(false); alert('저장 실패: ' + err); }).upsertCompany(draft, originalName);
    };

    const removeCompany = (idx) => {
      if (!confirm(`'${companies[idx].name}'을 삭제하시겠습니까?`)) return;
      google.script.run.withSuccessHandler(() => {
        setCompanies(companies.filter((_, i) => i !== idx));
      }).withFailureHandler(err => alert('삭제 실패: ' + err)).deleteCompany(companies[idx].name);
    };

    const saveDefaultsNow = () => {
      setSavingDefaults(true);
      google.script.run.withSuccessHandler(() => {
        setSavingDefaults(false);
        setDefaults(defaultsDraft);
        alert('기본값이 저장되었습니다.');
      }).withFailureHandler(err => { setSavingDefaults(false); alert('저장 실패: ' + err); }).saveDefaults(defaultsDraft);
    };

    return (
      <div className="space-y-8">
        <div>
          <div className="flex justify-between items-center mb-3">
            <h3 className="font-bold text-gray-800">계약 법인 관리</h3>
            {editingIdx === null && <button onClick={startNew} className="text-blue-600 text-sm font-bold border border-blue-300 rounded px-3 py-1 hover:bg-blue-50">+ 법인 추가</button>}
          </div>
          <div className="space-y-2">
            {companies.map((c, idx) => (
              editingIdx === idx ? (
                <CompanyEditForm key={idx} draft={draft} setDraft={setDraft} onSave={saveCompany} onCancel={cancelEdit} saving={savingCompany} />
              ) : (
                <div key={idx} className="p-3 bg-white border rounded flex justify-between items-start gap-2">
                  <div className="text-sm">
                    <div className="font-bold text-blue-900">{c.name}</div>
                    <div className="text-gray-500">{c.address}</div>
                    <div className="text-gray-500">{c.phone} · 대표 {c.rep}</div>
                    <div className="text-gray-500">담당자 {c.managerName} · {c.managerPhone} · {c.managerEmail}</div>
                    <div className="text-gray-500">발신 이메일 {c.senderEmail || '(스크립트 소유자 계정)'}</div>
                  </div>
                  <div className="flex gap-2 shrink-0">
                    <button onClick={() => startEdit(idx)} className="text-xs text-blue-600 font-bold">수정</button>
                    <button onClick={() => removeCompany(idx)} className="text-xs text-red-500 font-bold">삭제</button>
                  </div>
                </div>
              )
            ))}
            {editingIdx === 'new' && <CompanyEditForm draft={draft} setDraft={setDraft} onSave={saveCompany} onCancel={cancelEdit} saving={savingCompany} />}
          </div>
        </div>

        <div className="border-t pt-6">
          <h3 className="font-bold text-gray-800 mb-3">새 계약서 초기값</h3>
          {!defaultsDraft ? (
            <p className="text-sm text-gray-400">불러오는 중...</p>
          ) : (
            <div className="bg-blue-50 p-4 rounded border border-blue-200 space-y-3">
              <div>
                <label className="text-xs font-bold text-gray-600 block mb-1">근무지</label>
                <input className="w-full p-2 border rounded text-sm" value={defaultsDraft.workPlace} onChange={e => setDefaultsDraft({ ...defaultsDraft, workPlace: e.target.value })} />
              </div>
              <div>
                <label className="text-xs font-bold text-gray-600 block mb-1">근로유형(임금테이블)</label>
                <select className="w-full p-2 border rounded text-sm" value={defaultsDraft.wageType} onChange={e => setDefaultsDraft({ ...defaultsDraft, wageType: e.target.value })}>
                  {wageTypes.map(t => <option key={t} value={t}>{t}</option>)}
                </select>
              </div>
              <div>
                <label className="text-xs font-bold text-gray-600 block mb-1">최저시급(원) — 매년 1월에 바꿔 주세요</label>
                <input inputMode="numeric" className="w-full p-2 border rounded text-sm" value={defaultsDraft.minimumWage || ''} onChange={e => setDefaultsDraft({ ...defaultsDraft, minimumWage: e.target.value.replace(/[^0-9]/g, '') })} />
              </div>
              <button onClick={saveDefaultsNow} disabled={savingDefaults} className="w-full py-2 bg-blue-600 text-white rounded font-bold text-sm disabled:opacity-50">{savingDefaults ? '저장 중...' : '기본값 저장'}</button>
            </div>
          )}
        </div>
      </div>
    );
  };

  // ⭐ 설정 탭 — 근로자에게 보내는 발송 메시지(이메일/문자 공용) 편집. 수정 탭의 조항 편집과
  //   같은 "변수 블록을 끌어다 놓으면 칩으로 들어간다" 방식을 그대로 쓰지만, 저장되는 값이
  //   HTML이 아니라 실제 메일/문자 본문에 바로 들어가는 순수 텍스트라서 변환 로직만 다르다
  //   (messageTemplateToEditorHtml/serializeMessageBody, 모듈 스코프에 정의).
  //   SettingsPanel과 같은 이유로 App 바깥(모듈 스코프)에 두고 상태를 props로 받는다.
  const MessageTemplateEditor = ({ messageTemplate, setMessageTemplate, touchedRef }) => {
    const [subject, setSubject] = useState(messageTemplate ? messageTemplate.subject : '');
    const [saving, setSaving] = useState(false);
    const bodyRef = useRef(null);
    const draggedChipRef = useRef(null);

    useEffect(() => { if (messageTemplate) setSubject(messageTemplate.subject); }, [messageTemplate]);

    const handleDeleteZoneDragOver = (e) => { if (draggedChipRef.current) e.preventDefault(); };
    const handleDeleteZoneDrop = (e) => {
      if (draggedChipRef.current) {
        e.preventDefault();
        draggedChipRef.current.remove();
        draggedChipRef.current = null;
      }
    };

    const save = () => {
      if (!bodyRef.current) return;
      if (!subject.trim()) return alert('메일 제목을 입력해 주세요.');
      const body = serializeMessageBody(bodyRef.current);
      setSaving(true);
      google.script.run.withSuccessHandler(() => {
        setSaving(false);
        setMessageTemplate({ subject, body });
        alert('저장되었습니다.');
      }).withFailureHandler(err => { setSaving(false); alert('저장 실패: ' + err); }).saveMessageTemplate(subject, body);
    };

    if (!messageTemplate) {
      return (
        <div className="border-t pt-6">
          <h3 className="font-bold text-gray-800 mb-3">발송 메시지 (이메일·문자)</h3>
          <p className="text-sm text-gray-400">불러오는 중...</p>
        </div>
      );
    }

    const initialBodyHtml = messageTemplateToEditorHtml(messageTemplate.body, MESSAGE_VARIABLE_FIELDS);

    return (
      <div className="border-t pt-6">
        <h3 className="font-bold text-gray-800 mb-1">발송 메시지 (이메일·문자)</h3>
        <p className="text-xs text-gray-400 mb-3">근로자에게 임금계약서를 보낼 때(작성 탭에서 이메일/문자 선택) 쓰이는 문구입니다. 신규입사·연봉갱신 공용이니 양쪽에 맞는 문구로 써 주세요. 문자는 제목 없이 본문만 전송됩니다.</p>

        <div
          onDragOver={handleDeleteZoneDragOver}
          onDrop={handleDeleteZoneDrop}
          className="p-3 bg-gray-50 border border-dashed border-gray-300 rounded mb-3"
        >
          <p className="text-xs font-bold text-gray-500 mb-2">변수 블록 — 끌어서 아래 본문에 놓으세요</p>
          <div className="flex flex-wrap gap-1">
            {MESSAGE_VARIABLE_FIELDS.map(f => (
              <div
                key={f.token}
                draggable="true"
                onDragStart={e => e.dataTransfer.setData('text/x-variable-token', f.token)}
                className="px-2 py-1.5 bg-white border border-blue-200 rounded cursor-grab text-xs font-bold text-blue-700 hover:bg-blue-50"
              >
                {f.label}
              </div>
            ))}
          </div>
          <p className="text-[11px] text-gray-400 pt-2 leading-tight">칩 삭제: × 버튼 / 백스페이스 / 칩을 이 영역으로 끌어오기</p>
        </div>

        <label className="text-xs font-bold text-gray-600 block mb-1">메일 제목 (이메일에만 사용)</label>
        <input className="w-full p-2 border rounded text-sm mb-3" value={subject} onChange={e => { touchedRef.current = true; setSubject(e.target.value); }} placeholder="메일 제목" />

        <label className="text-xs font-bold text-gray-600 block mb-1">본문 (이메일 본문 · 문자 내용 공용)</label>
        <div
          ref={bodyRef}
          contentEditable
          suppressContentEditableWarning
          dangerouslySetInnerHTML={{ __html: initialBodyHtml }}
          onClick={handleEditableBodyClick}
          onKeyDown={e => { touchedRef.current = true; handleMessageBodyKeyDown(e); }}
          onDrop={e => { touchedRef.current = true; handleEditableBodyDrop(e, draggedChipRef, MESSAGE_VARIABLE_FIELDS); }}
          onDragOver={e => e.preventDefault()}
          onDragStart={e => handleEditableBodyDragStart(e, draggedChipRef)}
          style={{ whiteSpace: 'pre-wrap' }}
          className="min-h-[200px] p-3 border-2 border-dashed border-gray-300 rounded bg-white text-sm leading-relaxed focus:border-blue-400 outline-none"
        />
        <button onClick={save} disabled={saving} className="w-full mt-3 py-2 bg-blue-600 text-white rounded font-bold text-sm disabled:opacity-50">{saving ? '저장 중...' : '발송 메시지 저장'}</button>
      </div>
    );
  };

  // ⭐ 수정 탭 본체 — 이제 본문 편집창을 사이드바에 따로 두지 않는다. 옆에 이미 떠 있는
  //   계약서(.a4-page, WageContractDocument)의 해당 조항이 바로 contentEditable이 되어
  //   워드/한글처럼 "용지 위에 글쓰는" 느낌으로 고치고, 여기(사이드바)는 조항 선택 +
  //   끌어다 쓰는 변수 블록 + 저장/취소만 남긴다. 실제 제목/본문 DOM은 App이 만든
  //   editableTitleRef/editableBodyRef를 통해 계약서 쪽과 공유한다.
  const ClauseEditorPanel = ({ clauses, setClauses, editingClauseNum, setEditingClauseNum, editableTitleRef, editableBodyRef, draggedChipRef }) => {
    const [saving, setSaving] = useState(false);

    // ⭐ 변수 블록을 본문 바깥(이 사이드바 쪽)으로 끌어다 놓으면 삭제 — ×/백스페이스가
    //   항상 되는 대안이라 본문 입장에서는 세 번째 방법일 뿐이다.
    const handleDeleteZoneDragOver = (e) => { if (draggedChipRef.current) e.preventDefault(); };
    const handleDeleteZoneDrop = (e) => {
      if (draggedChipRef.current) {
        e.preventDefault();
        draggedChipRef.current.remove();
        draggedChipRef.current = null;
      }
    };

    const selectClause = (num) => {
      if (num === editingClauseNum) { setEditingClauseNum(null); return; }
      setEditingClauseNum(num);
    };

    const cancel = () => setEditingClauseNum(null);

    const save = () => {
      const num = editingClauseNum;
      if (!num || !editableBodyRef.current) return;
      // ⭐ 머리말·월지급액(3~8)처럼 계약서에 제목이 따로 보이지 않는 문구는 제목 편집칸이
      //   없으므로(editableTitleRef가 비어 있음) 기존 제목을 그대로 유지한다.
      const title = editableTitleRef.current
        ? editableTitleRef.current.textContent.trim()
        : ((clauses[num] && clauses[num].title) || CLAUSE_DEFAULTS[num].title);
      if (!title) return alert('조항 제목을 입력해 주세요.');
      const body = serializeEditorHtml(editableBodyRef.current);
      setSaving(true);
      google.script.run.withSuccessHandler(() => {
        setSaving(false);
        setClauses(prev => ({ ...prev, [num]: { title, body } }));
        alert('저장되었습니다.');
      }).withFailureHandler(err => { setSaving(false); alert('저장 실패: ' + err); }).saveClauseTemplate(num, title, body);
    };

    return (
      <div>
        <p className="text-xs font-bold text-gray-500 mb-2">문구/동의서를 고르면 오른쪽 계약서 본문이 바로 수정 가능해집니다</p>
        <div className="grid grid-cols-3 gap-1 mb-4">
          {EDITABLE_CLAUSE_NUMS.map(num => (
            <button
              key={num}
              onClick={() => selectClause(num)}
              className={`px-2 py-2 rounded text-xs font-bold leading-tight ${editingClauseNum === num ? 'bg-blue-600 text-white' : 'bg-white border text-gray-700 hover:bg-gray-50'}`}
            >
              {clauseSelectorLabel(num)}
            </button>
          ))}
        </div>

        {editingClauseNum && (
          <>
            <div
              onDragOver={handleDeleteZoneDragOver}
              onDrop={handleDeleteZoneDrop}
              className="p-3 bg-gray-50 border border-dashed border-gray-300 rounded"
            >
              <p className="text-xs font-bold text-gray-500 mb-2">변수 블록 — 끌어서 오른쪽 계약서 본문에 놓으세요</p>
              <div className="flex flex-wrap gap-1">
                {VARIABLE_FIELDS.map(f => (
                  <div
                    key={f.token}

                    {f.label}
                  </div>

            </div>
            <div className="flex gap-2 pt-3">
              <button onClick={save} disabled={saving} className="flex-1 py-2 bg-blue-600 text-white rounded font-bold text-sm disabled:opacity-50">{saving ? '저장 중...' : `${clauseSelectorLabel(editingClauseNum)} 저장`}</button>

            </div>
          </>
        )}
      </div>
    );
  };

  // ⭐ 작성 탭 근로자 카드 — 연봉갱신 일괄 발송처럼 사람마다 입사년도·근로유형·월지급액이 다르므로
  //   임금 정보는 카드마다 따로 둔다. key는 카드 삭제로 순서가 바뀌어도 조회 응답이 엉뚱한 카드에
  //   붙지 않게 하는 고정 식별자다.
  let workerKeySeq = 0;
  const newWorker = (wageType) => ({
    key: ++workerKeySeq, name: '', password: '', email: '', mode: 'email',
    joinYear: TODAY.slice(0, 4), wageType: wageType || '사무&생산',
    wage: { ...EMPTY_WAGE }, wageLookup: 'idle', manualWage: false, wageTypeTouched: false,
  });

  // ⭐ 직접 입력한 임금의 오류 문구(없으면 null). 서버 resolveWorkerWage_와 같은 규칙이다.
  const manualWageError = (wage) => {
    const n = (k) => Number(wage[k]) || 0;
    if (!n('monthlyTotal') || !n('annualTotal') || !n('hourlyWage')) return '월지급액·연봉·시급을 모두 입력해 주세요.';
    const sum = n('baseWage') + n('overtimeWage') + n('nightWage');
    if (sum !== n('monthlyTotal')) return `기본급+연장수당+야간수당 합계(${fmtWon(sum)}원)가 월지급액(${fmtWon(n('monthlyTotal'))}원)과 다릅니다.`;
    return null;
  };
  const isWorkerWageReady = (w) => w.manualWage ? !manualWageError(w.wage) : (w.wageLookup === 'ok' && Number(w.wage.hourlyWage) > 0);
  const isBelowMinimumWage = (w, minimumWage) => {
    const hourly = Number(w.wage.hourlyWage) || 0;
    return hourly > 0 && minimumWage > 0 && hourly < minimumWage;
  };

  // ⭐ 직접 입력 칸 — 금액은 콤마 표시(숫자만 저장), 시간은 37.5처럼 소수점을 허용한다.
  const WageNumberInput = ({ label, value, onChange, decimal }) => (
    <label className="block">

  const WorkerCard = ({ w, index, count, wageTypes, minimumWage, isPreview, onPreview, onUpdate, onRemove, onMonthlyChange, onWageTypeChange, onToggleManual, autoHyphenPhone }) => {

            {/* ⭐ 발송 방식을 근로자 카드별로 선택 */}
            <div className="flex gap-2 text-xs">
              <label className="flex items-center cursor-pointer">
                <input type="radio" name={`mode-${w.key}`} value="email" checked={(w.mode || 'email') === 'email'} onChange={() => onUpdate({ mode: 'email' })} className="mr-1"/>이메일
              </label>
              <label className="flex items-center cursor-pointer">
                <input type="radio" name={`mode-${w.key}`} value="sms" checked={w.mode === 'sms'} onChange={() => onUpdate({ mode: 'sms' })} className="mr-1"/>문자
              </label>
            </div>
            {count > 1 && !isPreview && <button onClick={onPreview} className="text-xs text-blue-600 font-bold">미리보기</button>}
            {count > 1 && (
              <button onClick={onRemove} className="text-gray-400 hover:text-red-500 font-bold text-xl leading-none">×</button>

          </div>
        </div>
        <div className="space-y-2">
          <input placeholder="성 명" value={w.name} onChange={e => onUpdate({ name: e.target.value })} className="border p-2 w-full rounded text-sm"/>
          <input placeholder="전화번호" value={w.password} onChange={e => onUpdate({ password: autoHyphenPhone(e.target.value) })} className="border p-2 w-full rounded text-sm bg-yellow-50"/>
          {(w.mode || 'email') === 'email' && (<input placeholder="이메일" value={w.email} onChange={e => onUpdate({ email: e.target.value })} className="border p-2 w-full rounded text-sm"/>)}

          <div className="grid grid-cols-2 gap-2 pt-2 border-t">
            <label className="block">
              <span className="text-xs font-bold text-gray-600">입사년도</span>
              <input inputMode="numeric" maxLength={4} value={w.joinYear} onChange={e => onUpdate({ joinYear: e.target.value.replace(/[^0-9]/g, '') })} className="border p-2 w-full rounded text-sm"/>
            </label>
            <label className="block">
              <span className="text-xs font-bold text-gray-600">근로유형(임금테이블)</span>
              <select value={w.wageType} onChange={e => onWageTypeChange(e.target.value)} disabled={w.manualWage} className="border p-2 w-full rounded text-sm bg-white disabled:bg-gray-100">
                {wageTypes.map(t => <option key={t} value={t}>{t}</option>)}

            </label>
          </div>

          <label className="block">
            <span className="text-xs font-bold text-gray-600">월지급액</span>
            <div className="flex items-center gap-1">
              <input
                inputMode="numeric" placeholder="예: 2,156,880"
                className="p-2 border rounded w-full text-right font-bold text-blue-700"
                value={w.wage.monthlyTotal ? Number(w.wage.monthlyTotal).toLocaleString() : ''}
                onChange={e => onMonthlyChange(e.target.value.replace(/[^0-9]/g, ''))}
              />
              <span className="text-sm">원</span>
            </div>
          </label>
          {!w.manualWage && w.wageLookup === 'loading' && <p className="text-xs text-gray-500">임금테이블 조회 중...</p>}
          {!w.manualWage && w.wageLookup === 'notfound' && <p className="text-xs text-red-500 font-bold">"{w.wageType}" 임금테이블에 없는 금액입니다. 아래 "직접 입력"을 쓸 수 있습니다.</p>}
          {!w.manualWage && w.wageLookup === 'error' && <p className="text-xs text-red-500 font-bold">임금테이블 조회 중 오류가 발생했습니다.</p>}

          <label className="flex items-center gap-2 text-xs font-bold text-gray-700 cursor-pointer w-fit">
            <input type="checkbox" checked={w.manualWage} onChange={e => onToggleManual(e.target.checked)} />

          {w.manualWage ? (
            <div className="bg-orange-50 border border-orange-200 rounded p-2 space-y-2">

                <WageNumberInput label="시급(원)" value={w.wage.hourlyWage} onChange={v => setWage('hourlyWage', v)} />
                <WageNumberInput label="기본급(원)" value={w.wage.baseWage} onChange={v => setWage('baseWage', v)} />

                <WageNumberInput label="연장수당(원)" value={w.wage.overtimeWage} onChange={v => setWage('overtimeWage', v)} />

              </div>
              <p className="text-[11px] text-gray-500">연봉은 월지급액 × 12로 자동 채워지며 직접 고칠 수 있습니다.</p>
              {manualErr && <p className="text-xs text-red-500 font-bold">{manualErr}</p>}
            </div>
          ) : (
            <div className="bg-gray-50 p-2 rounded border text-gray-700 grid grid-cols-2 gap-x-2 gap-y-1 text-xs">
              <span>연봉: <b>{fmtWon(w.wage.annualTotal)}</b>원</span>
              <span>시급: <b>{fmtWon(w.wage.hourlyWage)}</b>원</span>
              <span>기본급: {fmtWon(w.wage.baseWage)}원 ({w.wage.baseHours}h)</span>
              <span>연장수당: {fmtWon(w.wage.overtimeWage)}원 ({w.wage.overtimeHours}h)</span>
              <span>야간수당: {fmtWon(w.wage.nightWage)}원 ({w.wage.nightHours}h)</span>
            </div>
          )}
          {isBelowMinimumWage(w, minimumWage) && (
            <p className="text-xs text-red-600 font-bold bg-red-50 border border-red-200 rounded p-2">⚠ 시급 {fmtWon(w.wage.hourlyWage)}원이 최저시급 {fmtWon(minimumWage)}원보다 낮습니다.</p>
          )}
        </div>
      </div>
    );
  };

  // ⭐ 서명 단계(5·6·7단계)가 함께 쓰는 서명 캔버스 블록. 처음엔 App
  //   내부에 중첩해서 정의했었는데, 그러면 App이 리렌더될 때마다(여기서는 손을 떼서
  //   setIsDrawing(false)가 호출되는 바로 그 순간에!) 함수 참조가 매번 새로 생겨서 React가
  //   <canvas>를 통째로 마운트 해제/재마운트해버린다 — 그래서 "그려지지만 손을 떼면 지워지는"
  //   버그가 났다. WageContractDocument/SettingsPanel처럼 모듈 스코프로 빼고 필요한 값/함수를
  //   전부 props로 받아야 리렌더돼도 같은 <canvas> DOM이 유지된다.
  const SignaturePad = ({ canvasRef, startDraw, moveDraw, setIsDrawing, clearCanvas }) => (
    <>
      <div className="border-2 border-gray-400 rounded bg-white touch-none h-40 max-w-[600px] mx-auto">
        <canvas
          ref={canvasRef}
          width={Math.min(window.innerWidth - 40, 600)}
          height={160}
          onMouseDown={startDraw}
          onMouseMove={moveDraw}
          onMouseUp={()=>setIsDrawing(false)}
          onMouseLeave={()=>setIsDrawing(false)}
          onTouchStart={startDraw}
          onTouchMove={moveDraw}
          onTouchEnd={()=>setIsDrawing(false)}
          className="w-full h-full"
        />
      </div>
      <div className="text-center">
        <button onClick={clearCanvas} className="text-red-500 text-sm mt-2">
          <Eraser className="inline w-3 h-3"/> 다시 쓰기
        </button>
      </div>
    </>
  );

  const App = () => {

  // 4-4. 주요 헬퍼 함수 (Index.html)
  // ⭐ 전화번호 하이픈 처리
  const autoHyphenPhone = (str) => {
    const clean = String(str).replace(/[^0-9]/g, '');
    if (clean.length <= 3) return clean;
    if (clean.startsWith('02')) {
      if (clean.length <= 5) return clean.replace(/(\d{2})(\d{1,3})/, '$1-$2');
      if (clean.length <= 9) return clean.replace(/(\d{2})(\d{3})(\d{1,4})/, '$1-$2-$3');
      return clean.replace(/(\d{2})(\d{4})(\d{1,4})/, '$1-$2-$3');
    } else {
      if (clean.length <= 7) return clean.replace(/(\d{3})(\d{1,4})/, '$1-$2');
      if (clean.length <= 10) return clean.replace(/(\d{3})(\d{3})(\d{1,4})/, '$1-$2-$3');
      return clean.replace(/(\d{3})(\d{4})(\d{1,4})/, '$1-$2-$3');
    }
  };

  // 4-4. 주요 헬퍼 함수 (Index.html)
  // ⭐ 주민등록번호 하이픈 처리
  const autoHyphenRegNum = (str) => {
    const clean = String(str).replace(/[^0-9]/g, '');
    if (clean.length <= 6) return clean;
    return clean.replace(/(\d{6})(\d{1,7})/, '$1-$2').slice(0, 14);
  };

  // ⭐ 법인별 정보 (서버 설정(회사설정 시트)을 못 불러왔을 때 쓰는 기본값 — 최초 렌더링이 비어보이지 않도록 유지)
  const DEFAULT_COMPANIES = [
    { name: '(주)케이프라이드', address: '강원도 횡성군 우천면 우천제2농공단지로 65-50', phone: 'T. 033-644-4467 F.033-644-1944', rep: '김도영', managerPhone: '033-340-0023', managerEmail: 'kpride@example.com', managerName: '송문주', senderEmail: ''},
    { name: '㈜케이펙', address: '강원도 강릉시 정원로 54, 8층(교동, 주니어타운)', phone: 'T. 033-644-4467 F.033-644-1944', rep: '김도영', managerPhone: '033-340-0012', managerEmail: 'kpride@example.com', managerName: '하주연', senderEmail: '' },
    { name: '백두대간영농조합법인', address: '강원도 강릉시 정원로 54, 8층(교동, 주니어타운)', phone: 'T. 033-644-4467 F.033-644-1944', rep: '김도영', managerPhone: '033-340-0021', managerEmail: 'kpride@example.com', managerName: '서영민', senderEmail: '' },
    { name: '㈜보담', address: '강원도 원주시 저금어지길 456(가현동 강원LPC 2층)', phone: 'T. 033-644-4467 F.033-644-1944', rep: '이승수', managerPhone: '033-340-0020', managerEmail: 'kpride@example.com', managerName: '이선우', senderEmail: '' },
    { name: '(주)마시타', address: '강원도 강릉시 정원로 54, 8층(교통, 주니어타운)', phone: 'T. 033-644-4467 F.033-644-1944', rep: '김주원', managerPhone: '033-340-0023', managerEmail: 'kpride@example.com', managerName: '송문주', senderEmail: ''}
  ];
  // ⭐ 법인 목록/직인 이미지는 이제 서버(회사설정 시트, 직인 Drive 폴더)에서 불러온다 — 회사 추가/수정 시 코드 배포 없이 시트만 고치면 됨
  const [companies, setCompanies] = useState(DEFAULT_COMPANIES);
  const [sealImages, setSealImages] = useState({});
  // ⭐ getSealImage() 서버 응답이 도착했는지(성공/실패 무관) 표시 — 어떤 회사명을 마지막으로
  //   확인했는지 저장한다. "완료" 화면의 PDF 저장 버튼을 이게 true가 되기 전까지 숨겨서,
  //   근로자가 자기 링크를 열자마자 바로 PDF 저장을 눌러도 직인이 아직 도착하기 전에
  //   window.print()가 찍혀 직인 없는 PDF가 나오는 경쟁 상태를 막는다(관리자는 승인
  //   직후 이 값이 이미 채워져 있어 영향 없음).
  const [sealCheckedFor, setSealCheckedFor] = useState(null);
  // ⭐ "조항템플릿" 시트에서 불러온 문구 재정의 — { 'total': {title, body}, ... }.
  //   비어있으면(=로드 전이거나 시트 미설정) CLAUSE_DEFAULTS 문구를 그대로 보여준다.
  const [clauses, setClauses] = useState({});
  // ⭐ 설정 탭에서 관리하는 "새 계약서 초기값" (근무지/근로유형)
  const [defaults, setDefaults] = useState(null);
  // ⭐ 근로유형(=임금테이블 시트 이름) 목록 — 서버 getConfig()의 wageTypes로 덮어쓴다.
  const [wageTypes, setWageTypes] = useState(['영업기본', '영업(35시간)', '영업(37.5시간)', '사무&생산', '감시적단속자']);
  // ⭐ 근로자 카드별 임금테이블 조회 순번/타이머 — { [worker.key]: ... }. 조회 응답이 입력 순서와
  //   다르게 도착해도(타이핑 중 여러 번 호출) 그 카드의 가장 마지막 요청 응답만 반영한다.
  const wageReqSeqRef = useRef({});
  const wageLookupTimerRef = useRef({});
  // ⭐ 관리자 비밀번호 — 승인(approveContract) 때 서버에서 다시 확인하도록 게이트 통과 시 기억해둔다.
  //   화면 메모리에만 두고 어디에도 저장하지 않는다.
  const adminPasswordRef = useRef('');
  // ⭐ 설정 탭에서 관리하는 "발송 메시지"(이메일/문자 공용 — 제목은 이메일에만 쓰임).
  //   null로 두면 서버 getConfig() 응답이 늦거나(혹은 구버전 Code.gs가 배포돼 있어 아예
  //   안 오거나) 하면 설정 탭이 "불러오는 중..."에서 영영 멈춰버린다. defaults/clauses와
  //   달리 messageTemplate은 이 기본값 자체가 곧 실제 발송 문구(Code.gs의
  //   DEFAULT_MESSAGE_SUBJECT/BODY와 동일)라서, 처음부터 바로 보여줘도 안전하다 —
  //   서버 응답이 오면 그 값으로 덮어쓴다.

  // 4-2. formData — 계약서 핵심 데이터 (Index.html)

  //   월지급액을 입력하면 임금테이블 시트에서 채워진다(발송 시 서버가 한 번 더 조회해 확정).
  const [formData, setFormData] = useState({

  // 4-3. 기타 UI 상태 변수 (Index.html)

  const [workerList, setWorkerList] = useState(() => [newWorker()]);

  const [previewKey, setPreviewKey] = useState(null);

  const [adminTab, setAdminTab] = useState('작성');

  //   본문/제목 DOM은 WageContractDocument(계약서 쪽)에 떠 있고, 사이드바(ClauseEditorPanel)의

  const [editingClauseNum, setEditingClauseNum] = useState(null);

  const [isAdminAuthed, setIsAdminAuthed] = useState(false);

  // ⭐ google.script.run 공통 실패 처리 — withFailureHandler가 없으면 서버 에러 시
  //   화면이 "처리중..."에 멈춘 채로 성공인지 실패인지 알 수 없는 상태가 된다.
  //   중요한 사용자 액션(발송/서명제출/승인 등)에는 이걸로 로딩을 풀고 알려준다.
  const handleServerError = (error) => {
    setLoading(false);
    alert("오류가 발생했습니다. 잠시 후 다시 시도해 주세요.\n(" + (error && error.message ? error.message : String(error)) + ")");
  };

  // ⭐ 기존 서명 보여주기
  useEffect(() => {
    if (workerStep >= FIRST_SIGN_STEP && workerStep <= LAST_WORKER_STEP && canvasRef.current) {
      const canvas = canvasRef.current;
      const ctx = canvas.getContext('2d');

      ctx.clearRect(0, 0, canvas.width, canvas.height);
      
      const signKey = signKeyForStep(workerStep);
      
      if (signatures[signKey]) {
        const img = new Image();
        img.onload = () => {
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        };
        img.src = signatures[signKey];
      }
    }
  }, [workerStep]);
  
  useEffect(() => {
    const idInput = document.getElementById('data-contract-id');
    const modeInput = document.getElementById('data-view-mode');

    const urlParams = new URLSearchParams(window.location.search);
    const id = urlParams.get('id') || (idInput ? idInput.value : null);
    const mode = urlParams.get('mode') || (modeInput ? modeInput.value : null);
    
    setUrlId(id);

    // ⭐ (근로자)접속 링크 유효성 검사
    if (id && id !== "null" && id !== "") {
      setLoading(true);
      // ⭐ 이 콜백은 useEffect(fn, [])의 마운트 시점 클로저라 바깥의 loading 변수는 항상
      //   초기값(false)으로 고정돼 있다 — if(loading)으로 다시 확인하면 서버가 진짜 멈춰도
      //   절대 true가 되지 않아 복구 로직이 죽은 코드가 된다. 대신 아래 모든 응답 경로가
      //   응답을 받는 즉시 clearTimeout(timeoutId)을 호출하므로, 8초 뒤에도 이 콜백이 아직
      //   살아있다는 것 자체가 "진짜 응답 없음"이라는 뜻이다 — 조건 없이 바로 복구한다.
      const timeoutId = setTimeout(() => { setLoading(false); alert("서버 응답 지연."); }, 8000);

      if (window.google && window.google.script) {
        if (mode === 'review') {
          // ⭐ 관리자 승인 전용 링크 — 비밀번호 확인 전에는 서버에서 계약 데이터를 아예 받아오지
          //   않는다(AdminPasswordGate가 비밀번호와 함께 loadSignedDataForAdmin을 호출해서
          //   한 번에 검증+조회). 여기서는 화면 전환만 해둔다.
          clearTimeout(timeoutId); setLoading(false);
          setIsManagerView(true);
          setAdminReviewMode(true);
          setStep(3);
        } else if (mode === 'view') {
          setIsManagerView(true);
          google.script.run.withSuccessHandler(data => {
            clearTimeout(timeoutId); setLoading(false);
            if (data) { 
              setFormData(data); 
              setSignatures({ sign1: data.sign1, sign2: data.sign2, sign3: data.sign3 }); 
              setContractStatus(data.status || 'COMPLETED');
              setStep(3); 
            } else {
              alert("유효하지 않거나 삭제된 문서입니다.");
              setIsInvalidLink(true);
            }
          }).withFailureHandler(err => {
            clearTimeout(timeoutId); setLoading(false);
            console.error('계약서 로드 실패:', err);
            setIsInvalidLink(true);
          }).loadSignedData(id);
        } else {
          google.script.run.withSuccessHandler(data => {
            clearTimeout(timeoutId); setLoading(false);
            if (data === "ALREADY_COMPLETED") {
              setStep(3); setContractStatus('COMPLETED');
              return alert("이미 최종 완료된 계약서입니다.");
            }
            if (data === "ALREADY_SUBMITTED") {
              // ⭐ 이미 서명 제출을 마치고 승인 대기 중인 상태 — 재작성은 막되, "유효하지 않은 링크"가
              //   아니라 SIGNED_BY_WORKER용 "전송 완료" 화면(아래 step3)을 그대로 보여준다.
              setStep(3); setContractStatus('SIGNED_BY_WORKER');
              return;
            }
            if (data) {
              setFormData({ ...data, empName: data.empName || '', empPhone: data.empPhone || '' });
              setContractStatus(data.status || 'DRAFT');
              if (data.status === 'SIGNED_BY_WORKER') {
                setSignatures({ sign1: data.sign1, sign2: data.sign2, sign3: data.sign3 });
                setStep(3); 
              } else {
                setStep(2); setIsIdentityVerified(false);
              }
            } else { 
              alert("유효하지 않은 링크입니다.");
              setIsInvalidLink(true);
            }
          }).withFailureHandler(err => {
            clearTimeout(timeoutId); setLoading(false);
            console.error('계약서 로드 실패:', err);
            setIsInvalidLink(true);
          }).loadDraftData(id);
        }
      } else { clearTimeout(timeoutId); setLoading(false); }
    }
  }, []);

  // ⭐ 법인 목록/직인 이미지를 서버(회사설정 시트, 직인 Drive 폴더)에서 불러오기
  // 새 계약서를 처음 작성하는 경우(id 없음)에는 목록의 첫 번째 법인으로 기본값도 맞춰준다.
  useEffect(() => {
    if (!(window.google && window.google.script)) return;
    // ⭐ id는 첫 번째 useEffect와 똑같이 "주소창 ?id= 또는 서버 템플릿이 넣어준 hidden input"
    //   둘 다에서 찾는다. Apps Script 웹앱은 화면이 iframe 안에서 돌아서 window.location.search에
    //   ?id=가 안 보일 수 있다 — 주소창만 보면 근로자 링크도 "새 계약서 작성"으로 오인해서,
    //   늦게 도착한 기본값(근무지/근로유형)이 근로자의 계약 데이터를 덮어쓰고 금액이 0원이 된다.
    const urlParams = new URLSearchParams(window.location.search);
    const idInput = document.getElementById('data-contract-id');
    const rawId = urlParams.get('id') || (idInput ? idInput.value : '');
    const hasId = !!rawId && rawId !== 'null';
    google.script.run.withSuccessHandler(cfg => {
      if (cfg && cfg.companies && cfg.companies.length) {
        setCompanies(cfg.companies);
        // ⭐ 이 응답이 도착하기 전에 관리자가 이미 드롭다운에서 법인을 직접 골랐다면
        //   (companyTouchedRef) 여기서 첫 번째 법인으로 되돌리지 않는다 — 안 그러면
        //   페이지를 열자마자 재빨리 법인을 바꿔도, 뒤늦게 도착한 이 응답이 선택을
        //   조용히 덮어써서 엉뚱한(기본) 법인으로 발송되는 사고가 날 수 있다.
        if (!hasId && !companyTouchedRef.current) {
          const first = cfg.companies[0];
          setFormData(prev => ({
            ...prev,
            companyName: first.name, companyAddress: first.address, companyPhone: first.phone,
            repName: first.rep, managerPhone: first.managerPhone, managerEmail: first.managerEmail, managerName: first.managerName
          }));
        }
      }
      if (cfg && cfg.clauses) setClauses(cfg.clauses);
      if (cfg && cfg.wageTypes && cfg.wageTypes.length) setWageTypes(cfg.wageTypes);
      if (cfg && cfg.defaults) {
        setDefaults(cfg.defaults);
        // ⭐ 새 계약서 작성 시(id 없음)에만 기본값을 덮어쓴다 — 이미 불러온/서명 중인 계약서는 건드리지 않음.
        //   companyTouchedRef와 같은 이유로, 이미 관리자가 직접 고친 필드가 있으면
        //   (defaultsTouchedRef) 늦게 도착한 이 응답으로 되돌리지 않는다.
        //   근로유형이 바뀌면 이전 근로유형 기준 금액은 무효이므로 임금 값도 같이 비운다.
        //   근로유형은 카드별 값이라, 아직 손대지 않은(근로유형을 안 바꿨고 금액도 안 넣은) 카드만 바꾼다.
        if (!hasId && !defaultsTouchedRef.current) {
          setFormData(prev => ({ ...prev, workPlace: cfg.defaults.workPlace || prev.workPlace }));
        }
        if (!hasId && cfg.defaults.wageType) {
          setWorkerList(prev => prev.map(w => (!w.wageTypeTouched && !w.manualWage && !w.wage.monthlyTotal) ? { ...w, wageType: cfg.defaults.wageType } : w));
        }
      }
      // ⭐ 설정 탭의 발송 메시지 편집기를 이미 고치기 시작했으면(messageTemplateTouchedRef)
      //   늦게 도착한 이 응답이 입력 중인 제목/본문을 조용히 되돌리지 않게 막는다.
      if (cfg && cfg.messageTemplate && !messageTemplateTouchedRef.current) setMessageTemplate(cfg.messageTemplate);
    }).withFailureHandler(err => console.error('법인 목록 로드 실패(기본값 사용):', err)).getConfig();
  }, []);

  // ⭐ 직인 이미지는 이제 getConfig()에 포함되지 않는다(모든 방문자에게 5개 법인 것을 다 내려주던
  //   문제 수정). 계약이 실제로 COMPLETED 상태가 됐을 때(=관리자가 승인/날인한 뒤)만, 그
  //   법인 것 한 장만 따로 요청한다 — 서명 중인 근로자나 아직 승인 전 상태에서는 아예 요청하지 않는다.
  useEffect(() => {
    if (contractStatus === 'COMPLETED' && formData.companyName && !sealImages[formData.companyName] && window.google && window.google.script) {
      google.script.run.withSuccessHandler(result => {
        if (result && result.dataUrl) setSealImages(prev => ({ ...prev, [formData.companyName]: result.dataUrl }));

        setSealCheckedFor(formData.companyName);
      }).withFailureHandler(err => {
        console.error('직인 이미지 로드 실패:', err);
